<svg xmlns="http://www.w3.org/2000/svg" class="diffusion-figure" viewBox="0 0 760 620" role="img" aria-labelledby="df-fid-moments-title df-fid-moments-desc">
<title id="df-fid-moments-title">两阶矩相同，分布也一定相同吗？</title>
<desc id="df-fid-moments-desc">一维手工总体反例：等概率取正负1的离散分布与标准高斯分布，均值都为0，方差都为1，因此两者高斯拟合间的总体Frechet矩距离为0，但原分布不同。该示意没有图像、Inception网络或实际图像FID测量。有限样本的距离估计通常不为零。</desc>
<defs><marker id="df-fid-moments-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--muted,#587082)" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui, 'Microsoft YaHei', sans-serif">
<rect width="760" height="620" rx="14" fill="var(--card,#ffffff)"/>
<text x="30" y="42" font-size="25" text-anchor="start" fill="var(--fg,#183248)" font-weight="700">两阶矩相同，分布也一定相同吗？</text>
<text x="30" y="78" font-size="19" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">一维总体分布的反例；手工构造，不是图像质量实验</text><rect x="30" y="110" width="700" height="130" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="50" y="142" font-size="21" text-anchor="start" fill="var(--fg,#183248)" font-weight="700">分布 A：等概率取 −1、+1</text><text x="50" y="175" font-size="20" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">均值 0；方差 1</text><path d="M380 213 L690 213" fill="none" stroke="var(--muted,#587082)" stroke-width="2"/><text x="415" y="232" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">-2</text><text x="475" y="232" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">-1</text><text x="535" y="232" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">0</text><text x="595" y="232" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">1</text><text x="655" y="232" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">2</text><rect x="30" y="260" width="700" height="130" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="50" y="292" font-size="21" text-anchor="start" fill="var(--fg,#183248)" font-weight="700">分布 B：标准高斯 N(0,1)</text><text x="50" y="325" font-size="20" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">均值 0；方差 1</text><path d="M380 363 L690 363" fill="none" stroke="var(--muted,#587082)" stroke-width="2"/><text x="415" y="382" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">-2</text><text x="475" y="382" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">-1</text><text x="535" y="382" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">0</text><text x="595" y="382" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">1</text><text x="655" y="382" font-size="15" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">2</text><path d="M475 213 L475 164" fill="none" stroke="var(--accent,#245de2)" stroke-width="2"/><path d="M595 213 L595 164" fill="none" stroke="var(--accent,#245de2)" stroke-width="2"/><text x="475" y="157" font-size="19" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">½</text><text x="595" y="157" font-size="19" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">½</text><polyline points="385.00,360.36 388.00,360.02 391.00,359.63 394.00,359.21 397.00,358.74 400.00,358.23 403.00,357.66 406.00,357.05 409.00,356.38 412.00,355.66 415.00,354.88 418.00,354.04 421.00,353.13 424.00,352.16 427.00,351.13 430.00,350.02 433.00,348.86 436.00,347.62 439.00,346.32 442.00,344.95 445.00,343.52 448.00,342.03 451.00,340.48 454.00,338.88 457.00,337.23 460.00,335.53 463.00,333.79 466.00,332.03 469.00,330.24 472.00,328.43 475.00,326.61 478.00,324.79 481.00,322.98 484.00,321.19 487.00,319.43 490.00,317.71 493.00,316.04 496.00,314.43 499.00,312.88 502.00,311.42 505.00,310.05 508.00,308.78 511.00,307.61 514.00,306.56 517.00,305.64 520.00,304.85 523.00,304.19 526.00,303.67 529.00,303.30 532.00,303.07 535.00,303.00 538.00,303.07 541.00,303.30 544.00,303.67 547.00,304.19 550.00,304.85 553.00,305.64 556.00,306.56 559.00,307.61 562.00,308.78 565.00,310.05 568.00,311.42 571.00,312.88 574.00,314.43 577.00,316.04 580.00,317.71 583.00,319.43 586.00,321.19 589.00,322.98 592.00,324.79 595.00,326.61 598.00,328.43 601.00,330.24 604.00,332.03 607.00,333.79 610.00,335.53 613.00,337.23 616.00,338.88 619.00,340.48 622.00,342.03 625.00,343.52 628.00,344.95 631.00,346.32 634.00,347.62 637.00,348.86 640.00,350.02 643.00,351.13 646.00,352.16 649.00,353.13 652.00,354.04 655.00,354.88 658.00,355.66 661.00,356.38 664.00,357.05 667.00,357.66 670.00,358.23 673.00,358.74 676.00,359.21 679.00,359.63 682.00,360.02 685.00,360.36" fill="none" stroke="var(--done,#087c65)" stroke-width="3"/><rect x="30" y="418" width="700" height="108" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="50" y="450" font-size="22" text-anchor="start" fill="var(--fg,#183248)" font-weight="700">两者高斯拟合相同 → 总体 Fréchet 矩距离 = 0</text><text x="50" y="486" font-size="20" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">原分布仍不同：一个只有两个取值，一个连续。</text><text x="30" y="561" font-size="18" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">FID 比较特征均值与协方差；有限样本估计通常不恰为 0。</text><text x="30" y="592" font-size="19" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">不能从“距离小”直接推出逐张图像合格。</text>
</g></svg>
