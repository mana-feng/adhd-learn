<svg xmlns="http://www.w3.org/2000/svg" class="diffusion-figure" viewBox="0 0 760 630" role="img" aria-labelledby="df-training-target-title df-training-target-desc">
<title id="df-training-target-title">训练标签从哪里来？</title>
<desc id="df-training-target-desc">真数据x0、均匀时间步t与一次抽取的高斯噪声epsilon构造带噪输入；网络以xt和t预测噪声。保留的同一epsilon作为MSE目标，只有参数theta被更新。一次训练更新不需要运行完整反向采样链。</desc>
<defs><marker id="df-training-target-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--muted,#587082)" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui, 'Microsoft YaHei', sans-serif">
<rect width="760" height="630" rx="14" fill="var(--card,#ffffff)"/>
<text x="30" y="42" font-size="25" text-anchor="start" fill="var(--fg,#183248)" font-weight="700">训练标签从哪里来？</text>
<text x="30" y="78" font-size="19" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">一次训练更新：抽一个 t，只做一次网络预测</text><rect x="30" y="105" width="200" height="84" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="130" y="140" font-size="23" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">真数据 x₀</text><text x="130" y="170" font-size="18" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">来自训练集</text><rect x="280" y="105" width="200" height="84" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="380" y="140" font-size="23" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">时刻 t</text><text x="380" y="170" font-size="18" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">均匀抽自 1…T</text><rect x="530" y="105" width="200" height="84" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="630" y="140" font-size="23" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">噪声 ε</text><text x="630" y="170" font-size="18" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">抽取一次并保留</text><path d="M130 189 L130 217 L380 217 L380 236" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)"/><path d="M380 189 L380 236" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)"/><path d="M630 189 L630 217 L400 217 L400 236" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)"/><rect x="130" y="242" width="500" height="72" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="380" y="272" font-size="19" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">闭式构造带噪输入</text><text x="380" y="299" font-size="24" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text><path d="M380 314 L380 344" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)"/><rect x="130" y="350" width="500" height="72" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="380" y="379" font-size="24" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">预测器 εθ(xₜ, t)</text><text x="380" y="405" font-size="19" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">输入 xₜ 和 t；输出噪声预测</text><path d="M380 422 L380 453" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)"/><path d="M730 148 L744 148 L744 495 L640 495" fill="none" stroke="var(--muted,#587082)" stroke-width="2" marker-end="url(#df-training-target-arrow)" stroke-dasharray="7 5"/><rect x="130" y="459" width="500" height="72" rx="12" fill="var(--quote-bg,#f1f5fa)" stroke="var(--border,#bbc9d8)"/><text x="380" y="490" font-size="21" text-anchor="middle" fill="var(--fg,#183248)" font-weight="700">MSE：预测 εθ 与保留的同一份 ε 比较</text><text x="380" y="516" font-size="19" text-anchor="middle" fill="var(--fg,#183248)" font-weight="400">损失反传，更新网络参数 θ</text><text x="30" y="574" font-size="19" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">虚线：同一份 ε 直接作为目标，不能重新抽一份。</text><text x="30" y="606" font-size="19" text-anchor="start" fill="var(--fg,#183248)" font-weight="400">这张图是训练路径；生成样本时才反复运行采样链。</text>
</g></svg>
