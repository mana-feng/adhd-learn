<svg xmlns="http://www.w3.org/2000/svg" class="diffusion-figure" viewBox="0 0 760 540" role="img" aria-labelledby="df-schedule-snr-title df-schedule-snr-desc">
<title id="df-schedule-snr-title">SNR = 1 是刻度，不是学习边界</title>
<desc id="df-schedule-snr-desc">比较1000步linear与cosine的累积alpha。横轴t，纵轴累积alpha而非其平方根。单位方差信号下，SNR为1对应alpha为0.5。满足阈值的步数为259与496；不代表有效学习步数或性能翻倍。</desc>
