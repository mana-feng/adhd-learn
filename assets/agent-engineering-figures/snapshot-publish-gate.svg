<svg xmlns="http://www.w3.org/2000/svg" class="ae-figure" width="360" height="776" viewBox="0 0 360 776" role="img" aria-labelledby="ae-snapshot-publish-gate-title ae-snapshot-publish-gate-desc">
<title id="ae-snapshot-publish-gate-title">发布新快照时，怎样避免看到半个版本？</title><desc id="ae-snapshot-publish-gate-desc">先在事务外计算候选快照 S2，再在同一 SQLite 写事务内重新核对当前语料、插入完整快照 S2、切换活动指针并提交。失败则回滚，旧指针仍指 S1。旧指针保留只证明发布未切换，S1 若与当前权限或语料不符仍不可作答。这里只表示同库事务，不表示外部向量库或断电恢复已验证。</desc>
<style>.ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#faf9f6;--ae-card:#fff;--ae-fg:#292a33;--ae-muted:#555965;--ae-line:#bfc3cb;--ae-accent:#0b609e;--ae-soft:#eaf3fa;--ae-warn:#98400a;--ae-warnbg:#fff1df;--ae-ok:#21653b;--ae-okbg:#eaf6ee;color:var(--ae-fg);font-family:"Microsoft YaHei","PingFang SC",sans-serif} .ae-figure[data-theme="dark"], [data-theme="dark"] .ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ae-figure:not([data-theme="light"]),:root.ae-figure:not([data-theme="light"]){--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b}} .ae-figure .bg{fill:var(--ae-bg)} .ae-figure .card{fill:var(--ae-card);stroke:var(--ae-line)} .ae-figure .soft{fill:var(--ae-soft);stroke:var(--ae-accent)} .ae-figure .warn{fill:var(--ae-warnbg);stroke:var(--ae-warn)} .ae-figure .ok{fill:var(--ae-okbg);stroke:var(--ae-ok)} .ae-figure text{fill:var(--ae-fg)} .ae-figure .title{font-size:21px;font-weight:700} .ae-figure .body{font-size:18px} .ae-figure .strong{font-size:18px;font-weight:700} .ae-figure .small{font-size:16px;fill:var(--ae-muted)} .ae-figure .number{font-size:24px;font-weight:700} .ae-figure .arrow{fill:none;stroke:var(--ae-accent);stroke-width:2} .ae-figure .attempt{fill:var(--ae-accent)} .ae-figure .request{fill:var(--ae-card);stroke:var(--ae-line);stroke-width:2} .ae-figure .success{fill:var(--ae-ok);stroke:var(--ae-ok)} .ae-figure .deferred{fill:var(--ae-warnbg);stroke:var(--ae-warn);stroke-width:2;stroke-dasharray:4 2}</style><defs><marker id="ae-snapshot-publish-gate-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ae-accent)"/></marker></defs>
<rect class="bg" width="360" height="776" rx="14"/>
<text x="24" y="34" class="title" text-anchor="start">怎样避免发布半个索引版本？</text>
<text x="24" y="61" class="small" text-anchor="start">S1 / S2 是快照标识，不是原文修订号</text>
<rect x="12" y="80" width="336" height="100" rx="12" class="card"/>
<text x="28" y="111" class="strong" text-anchor="start">① 先准备候选 S2</text>
<text x="28" y="140" class="body" text-anchor="start">读取可见语料 → 计算并校验全部向量</text>
<text x="28" y="166" class="small" text-anchor="start">此时活动指针仍指 S1</text>
<path d="M180 188V214" class="arrow" marker-end="url(#ae-snapshot-publish-gate-arrow)"/>
<rect x="12" y="226" width="336" height="176" rx="12" class="soft"/>
<text x="28" y="257" class="strong" text-anchor="start">② 以下步骤放在同一写事务</text>
<text x="28" y="291" class="body" text-anchor="start">重新核对完整可见语料是否变化</text>
<text x="28" y="323" class="body" text-anchor="start">插入完整 S2，再切活动指针 → S2</text>
<text x="28" y="355" class="strong" text-anchor="start">全部成功 → COMMIT</text>
<text x="28" y="385" class="small" text-anchor="start">期间检查失败 / 异常 → ROLLBACK</text>
<path d="M180 410V436" class="arrow" marker-end="url(#ae-snapshot-publish-gate-arrow)"/>
<rect x="12" y="448" width="336" height="83" rx="12" class="ok"/>
<text x="28" y="479" class="strong" text-anchor="start">提交成功：S2 整体可见</text>
<text x="28" y="509" class="body" text-anchor="start">不会先切指针、再补剩余向量</text>
<rect x="12" y="549" width="336" height="118" rx="12" class="warn"/>
<text x="28" y="580" class="strong" text-anchor="start">回滚：旧指针仍指 S1</text>
<text x="28" y="610" class="body" text-anchor="start">保留旧指针 ≠ 允许旧证据回答</text>
<text x="28" y="640" class="body" text-anchor="start">仍须符合当前语料、修订与权限</text>
<text x="24" y="706" class="small" text-anchor="start">同库 SQLite 事务示意；外部向量库</text>
<text x="24" y="732" class="small" text-anchor="start">需要另外设计发布与恢复协议。</text>
<text x="24" y="758" class="small" text-anchor="start">未验证断电、硬重启或磁盘损坏。</text>
</svg>
