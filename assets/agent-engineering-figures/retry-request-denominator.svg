<svg xmlns="http://www.w3.org/2000/svg" class="ae-figure" width="360" height="700" viewBox="0 0 360 700" role="img" aria-labelledby="ae-retry-request-denominator-title ae-retry-request-denominator-desc">
<title id="ae-retry-request-denominator-title">调用减少不等于成功率提高</title><desc id="ae-retry-request-denominator-desc">章内教学回放表格：同样五个输入请求，baseline 为十三次尝试、一成功四失败；bounded 为三次尝试、一成功一失败三未发出。两者成功率都是一除以五等于百分之二十。调用放大为二点六和零点六，后者小于一因为有未发出请求。数字为原文已有表格重绘，非本轮重新执行的实验结果。</desc>
<style>.ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#faf9f6;--ae-card:#fff;--ae-fg:#292a33;--ae-muted:#555965;--ae-line:#bfc3cb;--ae-accent:#0b609e;--ae-soft:#eaf3fa;--ae-warn:#98400a;--ae-warnbg:#fff1df;--ae-ok:#21653b;--ae-okbg:#eaf6ee;color:var(--ae-fg);font-family:"Microsoft YaHei","PingFang SC",sans-serif} .ae-figure[data-theme="dark"], [data-theme="dark"] .ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ae-figure:not([data-theme="light"]),:root.ae-figure:not([data-theme="light"]){--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b}} .ae-figure .bg{fill:var(--ae-bg)} .ae-figure .card{fill:var(--ae-card);stroke:var(--ae-line)} .ae-figure .soft{fill:var(--ae-soft);stroke:var(--ae-accent)} .ae-figure .warn{fill:var(--ae-warnbg);stroke:var(--ae-warn)} .ae-figure .ok{fill:var(--ae-okbg);stroke:var(--ae-ok)} .ae-figure text{fill:var(--ae-fg)} .ae-figure .title{font-size:21px;font-weight:700} .ae-figure .body{font-size:18px} .ae-figure .strong{font-size:18px;font-weight:700} .ae-figure .small{font-size:16px;fill:var(--ae-muted)} .ae-figure .number{font-size:24px;font-weight:700} .ae-figure .arrow{fill:none;stroke:var(--ae-accent);stroke-width:2} .ae-figure .attempt{fill:var(--ae-accent)} .ae-figure .request{fill:var(--ae-card);stroke:var(--ae-line);stroke-width:2} .ae-figure .success{fill:var(--ae-ok);stroke:var(--ae-ok)} .ae-figure .deferred{fill:var(--ae-warnbg);stroke:var(--ae-warn);stroke-width:2;stroke-dasharray:4 2}</style><defs><marker id="ae-retry-request-denominator-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ae-accent)"/></marker></defs>
<rect class="bg" width="360" height="700" rx="14"/>
<text x="24" y="34" class="title" text-anchor="start">少调用了，成功率就提高了吗？</text>
<text x="24" y="61" class="small" text-anchor="start">按原文章内表格重绘 · 非本轮回放</text>
<rect x="12" y="82" width="336" height="224" rx="12" class="card"/>
<text x="28" y="113" class="title" text-anchor="start">baseline</text>
<text x="28" y="143" class="small" text-anchor="start">同样 5 个输入请求；实心点为成功</text>
<circle cx="44" cy="170" r="13" class="success"/>
<circle cx="99" cy="170" r="13" class="request"/>
<circle cx="154" cy="170" r="13" class="request"/>
<circle cx="209" cy="170" r="13" class="request"/>
<circle cx="264" cy="170" r="13" class="request"/>
<text x="28" y="210" class="strong" text-anchor="start">成功 1 · 失败 4 · 未发出 0</text>
<rect x="28" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="51" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="74" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="97" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="120" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="143" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="166" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="189" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="212" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="235" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="258" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="281" y="228" width="17" height="18" rx="3" class="attempt"/>
<rect x="304" y="228" width="17" height="18" rx="3" class="attempt"/>
<text x="28" y="273" class="body" text-anchor="start">下游尝试 13 次；每个短条 = 1 次</text>
<text x="28" y="298" class="small" text-anchor="start">调用放大 13/5 = 2.6</text>
<rect x="12" y="328" width="336" height="224" rx="12" class="card"/>
<text x="28" y="359" class="title" text-anchor="start">bounded</text>
<text x="28" y="389" class="small" text-anchor="start">同样 5 个输入请求；实心点为成功</text>
<circle cx="44" cy="416" r="13" class="success"/>
<circle cx="99" cy="416" r="13" class="request"/>
<circle cx="154" cy="416" r="13" class="deferred"/>
<circle cx="209" cy="416" r="13" class="deferred"/>
<circle cx="264" cy="416" r="13" class="deferred"/>
<text x="28" y="456" class="strong" text-anchor="start">成功 1 · 失败 1 · 未发出 3</text>
<rect x="28" y="474" width="17" height="18" rx="3" class="attempt"/>
<rect x="51" y="474" width="17" height="18" rx="3" class="attempt"/>
<rect x="74" y="474" width="17" height="18" rx="3" class="attempt"/>
<text x="28" y="519" class="body" text-anchor="start">下游尝试 3 次；每个短条 = 1 次</text>
<text x="28" y="544" class="small" text-anchor="start">调用放大 3/5 = 0.6</text>
<text x="24" y="592" class="strong" text-anchor="start">成功占全部输入：两者都是 1/5</text>
<text x="24" y="624" class="body" text-anchor="start">未发出仍占分母；不是完成得更快。</text>
<text x="24" y="654" class="small" text-anchor="start">虚线点表示 deferred（未发出）。</text>
<text x="24" y="680" class="small" text-anchor="start">例子仅说明统计口径，不证明生产收益。</text>
</svg>
