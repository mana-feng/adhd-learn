<svg xmlns="http://www.w3.org/2000/svg" class="ae-figure" width="360" height="660" viewBox="0 0 360 660" role="img" aria-labelledby="ae-cas-version-race-title ae-cas-version-race-desc">
<title id="ae-cas-version-race-title">同读版本 1，为什么只有一个成功？</title><desc id="ae-cas-version-race-desc">同一会话内，left 和 right 都基于版本 1。假定 left 先获得写事务并提交，版本变为 2、轮次为 1。right 在自己的事务中发现 expected_version=1 与当前版本 2 不同，返回 version_conflict，版本和轮次均不增加。先后顺序可相反。冲突后先重新读取和理解变化，再决定新操作。</desc>
<style>.ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#faf9f6;--ae-card:#fff;--ae-fg:#292a33;--ae-muted:#555965;--ae-line:#bfc3cb;--ae-accent:#0b609e;--ae-soft:#eaf3fa;--ae-warn:#98400a;--ae-warnbg:#fff1df;--ae-ok:#21653b;--ae-okbg:#eaf6ee;color:var(--ae-fg);font-family:"Microsoft YaHei","PingFang SC",sans-serif} .ae-figure[data-theme="dark"], [data-theme="dark"] .ae-figure{width:100%;min-width:320px;max-width:360px;height:auto;--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ae-figure:not([data-theme="light"]),:root.ae-figure:not([data-theme="light"]){--ae-bg:#191a1f;--ae-card:#252730;--ae-fg:#f1efea;--ae-muted:#bfc5d2;--ae-line:#707887;--ae-accent:#87c6ff;--ae-soft:#203344;--ae-warn:#ffc58a;--ae-warnbg:#3d2b1d;--ae-ok:#97dfad;--ae-okbg:#20382b}} .ae-figure .bg{fill:var(--ae-bg)} .ae-figure .card{fill:var(--ae-card);stroke:var(--ae-line)} .ae-figure .soft{fill:var(--ae-soft);stroke:var(--ae-accent)} .ae-figure .warn{fill:var(--ae-warnbg);stroke:var(--ae-warn)} .ae-figure .ok{fill:var(--ae-okbg);stroke:var(--ae-ok)} .ae-figure text{fill:var(--ae-fg)} .ae-figure .title{font-size:21px;font-weight:700} .ae-figure .body{font-size:18px} .ae-figure .strong{font-size:18px;font-weight:700} .ae-figure .small{font-size:16px;fill:var(--ae-muted)} .ae-figure .number{font-size:24px;font-weight:700} .ae-figure .arrow{fill:none;stroke:var(--ae-accent);stroke-width:2} .ae-figure .attempt{fill:var(--ae-accent)} .ae-figure .request{fill:var(--ae-card);stroke:var(--ae-line);stroke-width:2} .ae-figure .success{fill:var(--ae-ok);stroke:var(--ae-ok)} .ae-figure .deferred{fill:var(--ae-warnbg);stroke:var(--ae-warn);stroke-width:2;stroke-dasharray:4 2}</style><defs><marker id="ae-cas-version-race-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ae-accent)"/></marker></defs>
<rect class="bg" width="360" height="660" rx="14"/>
<text x="24" y="34" class="title" text-anchor="start">同读版本 1，为何只成功一次？</text>
<text x="24" y="61" class="small" text-anchor="start">同一会话 · 两个不同操作编号</text>
<rect x="12" y="80" width="336" height="102" rx="12" class="soft"/>
<text x="28" y="110" class="strong" text-anchor="start">① 两个请求都读到 version=1</text>
<text x="28" y="140" class="body" text-anchor="start">left：expected_version=1</text>
<text x="28" y="166" class="body" text-anchor="start">right：expected_version=1</text>
<path d="M180 188V214" class="arrow" marker-end="url(#ae-cas-version-race-arrow)"/>
<rect x="12" y="226" width="336" height="132" rx="12" class="ok"/>
<text x="28" y="257" class="strong" text-anchor="start">② 假定 left 先进入写事务</text>
<text x="28" y="287" class="body" text-anchor="start">当前 1 = 期望 1 → 追加并提交</text>
<text x="28" y="318" class="strong" text-anchor="start">version=2，turns=1</text>
<text x="28" y="344" class="small" text-anchor="start">检查与写入在同一笔事务内</text>
<path d="M180 366V392" class="arrow" marker-end="url(#ae-cas-version-race-arrow)"/>
<rect x="12" y="404" width="336" height="118" rx="12" class="warn"/>
<text x="28" y="435" class="strong" text-anchor="start">③ right 再进入写事务</text>
<text x="28" y="465" class="body" text-anchor="start">当前 2 ≠ 期望 1 → 版本冲突</text>
<text x="28" y="495" class="body" text-anchor="start">version=2，turns=1；没有新增</text>
<text x="24" y="559" class="strong" text-anchor="start">先后可反过来，仍是一个成功。</text>
<text x="24" y="590" class="body" text-anchor="start">冲突后先重读、理解新上下文；</text>
<text x="24" y="617" class="body" text-anchor="start">再决定新操作，不能只替换版本号。</text>
<text x="24" y="646" class="small" text-anchor="start">教学时序；不是本轮并发测试记录。</text>
</svg>
