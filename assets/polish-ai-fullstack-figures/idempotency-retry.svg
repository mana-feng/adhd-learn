<svg xmlns="http://www.w3.org/2000/svg" width="360" height="774" viewBox="0 0 360 774" role="img" aria-labelledby="v02-ai-fullstack-idempotency-retry-title v02-ai-fullstack-idempotency-retry-desc" xml:lang="zh-CN">
<title id="v02-ai-fullstack-idempotency-retry-title">同一意图重试：何时执行，何时重放</title>
<desc id="v02-ai-fullstack-idempotency-retry-desc">先鉴权确定租户，再用租户与幂等键查询记录。没有记录时原子抢占；已有记录且请求体不同则拒绝，处理中不重复执行，已完成则重放结果。这是本章示例协议，不能保证远程上游恰好执行一次。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} @media (forced-colors:active){text{fill:CanvasText} rect{fill:Canvas;stroke:CanvasText} path,line{stroke:CanvasText}}</style>
<rect x="1" y="1" width="358" height="772" rx="16" fill="#ffffff" stroke="#c8d0db"/>
<text x="20" y="35" font-size="24" font-weight="700" fill="#253047">同一意图重试</text><text x="20" y="66" font-size="24" font-weight="700" fill="#253047">何时执行，何时重放</text><text x="20" y="110" font-size="18" font-weight="400" fill="#253047">先鉴权，再查（租户，键）</text><text x="20" y="137" font-size="18" font-weight="400" fill="#253047">同一次意图，重试沿用同一键</text><rect x="20" y="165" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="194" font-size="19" font-weight="700" fill="#0f665e">① 尚无记录 → 原子抢占</text><text x="34" y="222" font-size="18" font-weight="400" fill="#253047">只有成功认领者执行业务</text><text x="34" y="249" font-size="18" font-weight="400" fill="#253047">保存结果，标记为已完成</text><rect x="20" y="287" width="320" height="104" rx="12" fill="#fff5e9" stroke="#8b4518" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34" y="316" font-size="19" font-weight="700" fill="#8b4518">② 已有记录，请求体不同</text><text x="34" y="344" font-size="18" font-weight="400" fill="#253047">拒绝复用：本章示例返回 409</text><text x="34" y="371" font-size="18" font-weight="400" fill="#253047">不执行新的业务操作</text><rect x="20" y="409" width="320" height="104" rx="12" fill="#fff5e9" stroke="#8b4518" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34" y="438" font-size="19" font-weight="700" fill="#8b4518">③ 已有记录，仍在处理中</text><text x="34" y="466" font-size="18" font-weight="400" fill="#253047">返回处理中：本章示例为 409</text><text x="34" y="493" font-size="18" font-weight="400" fill="#253047">按协议稍后查询或重试</text><rect x="20" y="531" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="560" font-size="19" font-weight="700" fill="#0f665e">④ 已有记录，处理已完成</text><text x="34" y="588" font-size="18" font-weight="400" fill="#253047">同键、同请求体 → 重放结果</text><text x="34" y="615" font-size="18" font-weight="400" fill="#253047">重放不是再下一个新订单</text><text x="20" y="680" font-size="17" font-weight="400" fill="#253047">四项是互斥情况，不是四个步骤。</text><text x="20" y="707" font-size="17" font-weight="400" fill="#253047">到期、崩溃与上游副作用</text><text x="20" y="734" font-size="17" font-weight="400" fill="#253047">需要额外的恢复和对账设计。</text>
</svg>
