<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-labelledby="v02-ai-infra-roofline-bound-title v02-ai-infra-roofline-bound-desc" xml:lang="zh-CN">
<title id="v02-ai-infra-roofline-bound-title">Roofline：性能上界与观测性能的区别</title>
<desc id="v02-ai-infra-roofline-bound-desc">线性坐标教学假设：计算峰值8 TFLOP/s，带宽2 TB/s，拐点为4 FLOP/B。绿色实线为理论上界，手工示例圆点A为(1,1)，方点B为(6,5)，均低于相应上界。非硬件实测，也非MFU图。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} @media (forced-colors:active){text{fill:CanvasText} rect{fill:Canvas;stroke:CanvasText} path,line{stroke:CanvasText}}</style>
<rect x="1" y="1" width="358" height="728" rx="16" fill="#ffffff" stroke="#c8d0db"/>
<text x="20" y="35" font-size="24" font-weight="700" fill="#253047">Roofline 给出上界</text><text x="20" y="66" font-size="24" font-weight="700" fill="#253047">观测值可能低于它</text><text x="20" y="107" font-size="18" font-weight="400" fill="#253047">假设：峰值 8 TFLOP/s</text><text x="20" y="134" font-size="18" font-weight="400" fill="#253047">带宽 2 TB/s；线性坐标示意</text><path d="M58 404 V180 M58 404 H326" fill="none" stroke="#596579" stroke-width="1.5"/><path d="M58 404 L190 196 H322" fill="none" stroke="#0f665e" stroke-width="4"/><path d="M190 196 V404" stroke="#8b4518" stroke-width="1.5" stroke-dasharray="5 4"/><text x="53" y="430" font-size="17" font-weight="400" fill="#253047">0</text><text x="185" y="430" font-size="17" font-weight="400" fill="#253047">4</text><text x="317" y="430" font-size="17" font-weight="400" fill="#253047">8</text><text x="32" y="409" font-size="17" font-weight="400" fill="#253047">0</text><text x="32" y="305" font-size="17" font-weight="400" fill="#253047">4</text><text x="32" y="201" font-size="17" font-weight="400" fill="#253047">8</text><text x="20" y="172" font-size="17" font-weight="400" fill="#253047">TFLOP/s</text><text x="129" y="458" font-size="17" font-weight="400" fill="#253047">算术强度 FLOP/B</text><circle cx="91" cy="378" r="6" fill="#253047"/><rect x="250" y="268" width="12" height="12" fill="#253047"/><text x="102" y="380" font-size="17" font-weight="400" fill="#253047">● 示例 A</text><text x="206" y="256" font-size="17" font-weight="400" fill="#253047">■ 示例 B</text><text x="206" y="186" font-size="17" font-weight="400" fill="#253047">计算上界</text><text x="71" y="271" font-size="17" font-weight="400" fill="#253047">带宽上界</text><rect x="20" y="484" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="513" font-size="19" font-weight="700" fill="#0f665e">拐点 = 峰值算力 ÷ 带宽</text><text x="34" y="541" font-size="18" font-weight="400" fill="#253047">8 ÷ 2 = 4 FLOP/B</text><text x="34" y="568" font-size="18" font-weight="400" fill="#253047">上界 = min(8, 2 × 算术强度)</text><text x="20" y="633" font-size="17" font-weight="400" fill="#253047">低于上界还可能有调度或通信开销。</text><text x="20" y="660" font-size="17" font-weight="400" fill="#253047">Decode 的位置随批量、精度等变化；</text><text x="20" y="687" font-size="17" font-weight="400" fill="#253047">此图不把某个 MFU 区间定为铁律。</text>
</svg>
