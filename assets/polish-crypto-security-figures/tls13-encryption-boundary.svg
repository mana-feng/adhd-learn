<svg xmlns="http://www.w3.org/2000/svg" width="360" height="828" viewBox="0 0 360 828" role="img" aria-labelledby="v02-crypto-security-tls13-encryption-boundary-title v02-crypto-security-tls13-encryption-boundary-desc" xml:lang="zh-CN">
<title id="v02-crypto-security-tls13-encryption-boundary-title">TLS 1.3 完整握手的加密边界</title>
<desc id="v02-crypto-security-tls13-encryption-boundary-desc">限定为证书认证、ECDHE、无客户端证书的完整握手，省略重试及0-RTT。ClientHello和ServerHello明文传输，后续握手消息由握手流量密钥保护；应用数据使用应用流量密钥。证书、CertificateVerify、Finished不能并入明文ServerHello。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} @media (forced-colors:active){text{fill:CanvasText} rect{fill:Canvas;stroke:CanvasText} path,line{stroke:CanvasText}}</style>
<rect x="1" y="1" width="358" height="826" rx="16" fill="#ffffff" stroke="#c8d0db"/>
<text x="20" y="35" font-size="24" font-weight="700" fill="#253047">TLS 1.3：加密边界</text><text x="20" y="66" font-size="24" font-weight="700" fill="#253047">在 ServerHello 之后</text><text x="20" y="108" font-size="18" font-weight="400" fill="#253047">范围：证书认证 + ECDHE</text><text x="20" y="135" font-size="18" font-weight="400" fill="#253047">完整握手；无客户端证书</text><rect x="20" y="162" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="191" font-size="19" font-weight="700" fill="#0f665e">① 客户端 → 服务端 · 明文</text><text x="34" y="219" font-size="18" font-weight="400" fill="#253047">ClientHello</text><text x="34" y="246" font-size="18" font-weight="400" fill="#253047">含客户端 key_share</text><path d="M180 268 V288" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 282 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="296" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="325" font-size="19" font-weight="700" fill="#0f665e">② 服务端 → 客户端 · 明文</text><text x="34" y="353" font-size="18" font-weight="400" fill="#253047">ServerHello</text><text x="34" y="380" font-size="18" font-weight="400" fill="#253047">含服务端 key_share</text><path d="M20 422 H340" stroke="#8b4518" stroke-width="2" stroke-dasharray="6 4"/><text x="20" y="449" font-size="17" font-weight="700" fill="#253047">此后握手消息使用握手流量密钥</text><rect x="20" y="470" width="320" height="131" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="499" font-size="19" font-weight="700" fill="#0f665e">③ 服务端 → 客户端 · 加密</text><text x="34" y="527" font-size="18" font-weight="400" fill="#253047">EncryptedExtensions</text><text x="34" y="554" font-size="18" font-weight="400" fill="#253047">Certificate / CertificateVerify</text><text x="34" y="581" font-size="18" font-weight="400" fill="#253047">Finished</text><path d="M180 603 V621" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 615 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="629" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="658" font-size="19" font-weight="700" fill="#0f665e">④ 客户端 → 服务端 · 加密</text><text x="34" y="686" font-size="18" font-weight="400" fill="#253047">Finished（握手流量密钥）</text><text x="34" y="713" font-size="18" font-weight="400" fill="#253047">应用数据另用应用流量密钥</text><text x="20" y="775" font-size="17" font-weight="400" fill="#253047">按 RFC 8446 §2 简化；省略可选分支。</text>
</svg>
