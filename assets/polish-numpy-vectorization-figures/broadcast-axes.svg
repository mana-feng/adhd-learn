<svg xmlns="http://www.w3.org/2000/svg" id="v01-numpy-vectorization-broadcast-axes" viewBox="0 0 288 715" width="288" height="715" role="img" aria-labelledby="v01-numpy-vectorization-broadcast-axes-title v01-numpy-vectorization-broadcast-axes-desc"><title id="v01-numpy-vectorization-broadcast-axes-title">广播：对齐的是轴</title><desc id="v01-numpy-vectorization-broadcast-axes-desc">同一形状3乘4的数组：偏移4先视为1乘4，可广播；偏移3先视为1乘3，末位不兼容；把偏移3显式改为3乘1后可广播。图中的拉伸只表达索引关系，不表示复制输入。</desc><style>#v01-numpy-vectorization-broadcast-axes{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-numpy-vectorization-broadcast-axes text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-numpy-vectorization-broadcast-axes{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-numpy-vectorization-broadcast-axes{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-numpy-vectorization-broadcast-axes{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-numpy-vectorization-broadcast-axes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="715" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">广播：对齐的是轴</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">逐元素相加；先从右边对齐</text><rect x="18" y="94" width="252" height="150" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="122" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">每个特征一个偏移</text><text x="40" y="157" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">a       (3, 4)</text><text x="40" y="187" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">偏移    (1, 4)</text><text x="30" y="222" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">✓ 可加 → (3, 4)</text><rect x="18" y="265" width="252" height="150" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="293" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">三个偏移，少了一根轴</text><text x="40" y="328" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">a       (3, 4)</text><text x="40" y="358" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">偏移    (1, 3)</text><text x="30" y="393" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">× 不可加：末位 4 ≠ 3</text><rect x="18" y="436" width="252" height="150" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="464" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">显式加轴 c[:, None]</text><text x="40" y="499" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">a       (3, 4)</text><text x="40" y="529" font-size="20" font-weight="400" text-anchor="start" fill="var(--ink)">偏移    (3, 1)</text><text x="30" y="564" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">✓ 可加 → (3, 4)</text><text x="18" y="620" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">补 1 只是对齐形状的记法。</text><text x="18" y="645" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">广播不必复制输入；</text><text x="18" y="670" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">相加的结果仍占用内存。</text></svg>