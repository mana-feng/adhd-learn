<svg xmlns="http://www.w3.org/2000/svg" width="360" height="764" viewBox="0 0 360 764" role="img" aria-labelledby="v02-mendix-lowcode-commit-transaction-title v02-mendix-lowcode-commit-transaction-desc" xml:lang="zh-CN">
<title id="v02-mendix-lowcode-commit-transaction-title">Mendix Commit 与事务完成不是同一节点</title>
<desc id="v02-mendix-lowcode-commit-transaction-desc">持久化工单原费用为300，编辑成350。Commit object发出数据库写入，但外层Microflow尚未完成。正常完成后独立会话可读取350；触发回滚的错误可能恢复保存点的数据库值，内存对象却仍可能保留350。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} @media (forced-colors:active){text{fill:CanvasText} rect{fill:Canvas;stroke:CanvasText} path,line{stroke:CanvasText}}</style>
<rect x="1" y="1" width="358" height="762" rx="16" fill="#ffffff" stroke="#c8d0db"/>
<text x="20" y="35" font-size="24" font-weight="700" fill="#253047">看见 350</text><text x="20" y="66" font-size="24" font-weight="700" fill="#253047">不等于保存已完成</text><text x="20" y="109" font-size="18" font-weight="400" fill="#253047">示例：持久化工单，起始费用 300</text><rect x="20" y="143" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="172" font-size="19" font-weight="700" fill="#0f665e">1 · 页面 / 内存改为 350</text><text x="34" y="200" font-size="18" font-weight="400" fill="#253047">这是当前编辑上下文的值</text><text x="34" y="227" font-size="18" font-weight="400" fill="#253047">不能证明另一会话已经可见</text><path d="M180 249 V270" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 264 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="278" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="307" font-size="19" font-weight="700" fill="#0f665e">2 · Commit object(s)</text><text x="34" y="335" font-size="18" font-weight="400" fill="#253047">向数据库发出 INSERT / UPDATE</text><text x="34" y="362" font-size="18" font-weight="400" fill="#253047">仍在当前 Microflow 事务中</text><path d="M180 384 V405" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 399 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><text x="20" y="438" font-size="18" font-weight="700" fill="#253047">接下来看外层 Microflow 如何结束</text><rect x="20" y="457" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="486" font-size="19" font-weight="700" fill="#0f665e">A · 正常完成外层事务</text><text x="34" y="514" font-size="18" font-weight="400" fill="#253047">再由独立会话重新读取</text><text x="34" y="541" font-size="18" font-weight="400" fill="#253047">本例预期读到费用 350</text><rect x="20" y="579" width="320" height="104" rx="12" fill="#fff5e9" stroke="#8b4518" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34" y="608" font-size="19" font-weight="700" fill="#8b4518">B · 错误触发事务回滚</text><text x="34" y="636" font-size="18" font-weight="400" fill="#253047">数据库按保存点恢复</text><text x="34" y="663" font-size="18" font-weight="400" fill="#253047">内存仍可能显示 350</text><text x="20" y="723" font-size="17" font-weight="400" fill="#253047">A、B 是不同结局；以错误处理配置为准。</text>
</svg>
