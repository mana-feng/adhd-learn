<svg xmlns="http://www.w3.org/2000/svg" id="v01-pytorch-framework-detach-storage" viewBox="0 0 288 665" width="288" height="665" role="img" aria-labelledby="v01-pytorch-framework-detach-storage-title v01-pytorch-framework-detach-storage-desc"><title id="v01-pytorch-framework-detach-storage-title">detach：断梯度，仍共享存储</title><desc id="v01-pytorch-framework-detach-storage-desc">设x需要梯度，y=x乘3。y的梯度可回到x；d=y.detach()无该梯度路径，但d与y共享存储。c=y.detach().clone()既切断该路径又复制存储。单独clone通常可微。</desc><style>#v01-pytorch-framework-detach-storage{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-pytorch-framework-detach-storage text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-pytorch-framework-detach-storage{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-pytorch-framework-detach-storage{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-pytorch-framework-detach-storage{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-pytorch-framework-detach-storage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="665" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">detach：断梯度，仍共享存储</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">两种关系，要分开追踪。</text><text x="18" y="90" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">设 x 需要梯度，y = x * 3。</text><rect x="18" y="108" width="252" height="115" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="138" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">① 梯度：有没有回到 x</text><text x="30" y="175" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">y → ×3 → x：有路径</text><text x="30" y="204" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">d = y.detach()：无路径</text><rect x="18" y="244" width="252" height="150" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="274" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">② 存储：有没有另一份数值</text><text x="58" y="309" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">y</text><text x="214" y="309" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">d</text><path d="M66 318 L113 347" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#v01-pytorch-framework-detach-storage-arrow)"/><path d="M218 318 L175 347" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#v01-pytorch-framework-detach-storage-arrow)"/><text x="144" y="377" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">同一块存储</text><rect x="18" y="417" width="252" height="115" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="447" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">c = y.detach().clone()</text><text x="30" y="480" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">不接回 x 的梯度路径</text><text x="30" y="510" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">也不与 y 共享存储</text><text x="18" y="567" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">切断梯度 ≠ 复制数据。</text><text x="18" y="592" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">单独 clone() 会复制存储，</text><text x="18" y="617" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">但通常仍保留梯度路径。</text></svg>