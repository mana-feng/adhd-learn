<svg xmlns="http://www.w3.org/2000/svg" id="v01-python-pitfalls-nested-copy" viewBox="0 0 288 650" width="288" height="650" role="img" aria-labelledby="v01-python-pitfalls-nested-copy-title v01-python-pitfalls-nested-copy-desc"><title id="v01-python-pitfalls-nested-copy-title">浅拷贝：外层分开，内层共享</title><desc id="v01-python-pitfalls-nested-copy-desc">cfg 与 shallow 是两个字典，但 layers 指向同一个列表。向 cfg 的内层列表追加128后，两者都看到64、64、128。deepcopy得到另一内层列表，仍为64、64。</desc><style>#v01-python-pitfalls-nested-copy{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-python-pitfalls-nested-copy text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-python-pitfalls-nested-copy{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-python-pitfalls-nested-copy{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-python-pitfalls-nested-copy{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-python-pitfalls-nested-copy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="650" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">浅拷贝：外层分开，内层共享</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">原例：只看 layers 这个键</text><rect x="18" y="90" width="115" height="65" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="116" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">cfg</text><text x="30" y="141" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">字典 A</text><rect x="155" y="90" width="115" height="65" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="166" y="116" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">shallow</text><text x="166" y="141" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">字典 B</text><path d="M75 155 L112 206" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#v01-python-pitfalls-nested-copy-arrow)"/><path d="M211 155 L176 206" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#v01-python-pitfalls-nested-copy-arrow)"/><rect x="40" y="211" width="208" height="69" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5"/><text x="144" y="240" font-size="17" font-weight="700" text-anchor="middle" fill="var(--ink)">同一个内层列表</text><text x="144" y="265" font-size="18" font-weight="400" text-anchor="middle" fill="var(--ink)">[64, 64]</text><text x="18" y="315" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">cfg[&quot;layers&quot;].append(128)</text><text x="18" y="340" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">↓ 改的是这同一张列表</text><rect x="18" y="360" width="252" height="85" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="32" y="389" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">cfg → [64, 64, 128]</text><text x="32" y="420" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">shallow → 同样的内容</text><rect x="18" y="465" width="252" height="91" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="495" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">deep → [64, 64]</text><text x="32" y="526" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">另一张列表，不跟着改</text><text x="18" y="590" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">实线汇合：共享同一对象</text><text x="18" y="615" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">虚线框：deepcopy 的副本</text></svg>