<svg xmlns="http://www.w3.org/2000/svg" width="360" height="732" viewBox="0 0 360 732" role="img" aria-labelledby="v02-model-operations-drift-evidence-title v02-model-operations-drift-evidence-desc" xml:lang="zh-CN">
<title id="v02-model-operations-drift-evidence-title">漂移告警是线索，不是根因分类器</title>
<desc id="v02-model-operations-drift-evidence-desc">排查先核对管道和监控口径，再比较输入分布，并在标签到达后核对分组效果及校准。输入分布变或不变都不能独自确定概念漂移或标签漂移；应结合假设和验证选择处置。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} @media (forced-colors:active){text{fill:CanvasText} rect{fill:Canvas;stroke:CanvasText} path,line{stroke:CanvasText}}</style>
<rect x="1" y="1" width="358" height="730" rx="16" fill="#ffffff" stroke="#c8d0db"/>
<text x="20" y="35" font-size="24" font-weight="700" fill="#253047">漂移告警是线索</text><text x="20" y="66" font-size="24" font-weight="700" fill="#253047">先找证据，再选处置</text><rect x="20" y="102" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="131" font-size="19" font-weight="700" fill="#0f665e">1 · 先核对管道与口径</text><text x="34" y="159" font-size="18" font-weight="400" fill="#253047">缺失、单位、版本、采样变了吗？</text><text x="34" y="186" font-size="18" font-weight="400" fill="#253047">突变也可能来自真实业务变化</text><path d="M180 208 V230" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 224 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="238" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="267" font-size="19" font-weight="700" fill="#0f665e">2 · 比较输入分布 P(X)</text><text x="34" y="295" font-size="18" font-weight="400" fill="#253047">变化：提示进一步分组排查</text><text x="34" y="322" font-size="18" font-weight="400" fill="#253047">未变化：仍不能排除效果退化</text><path d="M180 344 V366" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 360 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="374" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="403" font-size="19" font-weight="700" fill="#0f665e">3 · 等真实标签核对效果</text><text x="34" y="431" font-size="18" font-weight="400" fill="#253047">分组看误差、排序与校准</text><text x="34" y="458" font-size="18" font-weight="400" fill="#253047">标签延迟与抽样偏差要注明</text><path d="M180 480 V502" fill="none" stroke="#596579" stroke-width="2"/><path d="m175 496 5 6 5-6" fill="none" stroke="#596579" stroke-width="2"/><rect x="20" y="510" width="320" height="104" rx="12" fill="#eef7f4" stroke="#0f665e" stroke-width="1.5"/><text x="34" y="539" font-size="19" font-weight="700" fill="#0f665e">4 · 有证据后验证候选处置</text><text x="34" y="567" font-size="18" font-weight="400" fill="#253047">修管道 / 校准 / 重训等</text><text x="34" y="594" font-size="18" font-weight="400" fill="#253047">用独立验证与灰度检验效果</text><text x="20" y="656" font-size="17" font-weight="400" fill="#253047">“输入变了”不等于某个单一根因。</text><text x="20" y="683" font-size="17" font-weight="400" fill="#253047">仅靠置信度或 PSI，不能确认</text><text x="20" y="710" font-size="17" font-weight="400" fill="#253047">概念漂移，也不能决定只需校准。</text>
</svg>
