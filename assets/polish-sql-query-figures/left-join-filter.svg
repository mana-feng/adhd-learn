<svg xmlns="http://www.w3.org/2000/svg" id="v01-sql-query-left-join-filter" viewBox="0 0 288 695" width="288" height="695" role="img" aria-labelledby="v01-sql-query-left-join-filter-title v01-sql-query-left-join-filter-desc"><title id="v01-sql-query-left-join-filter-title">LEFT JOIN：在哪一步筛</title><desc id="v01-sql-query-left-join-filter-desc">沿用原页三个用户：阿呆有paid和refunded订单，阿瓜只有refunded订单，阿花无订单。paid条件放ON时保留阿呆的paid单并为另两人补NULL，得到三行；放WHERE时只剩阿呆的paid单一行。</desc><style>#v01-sql-query-left-join-filter{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-sql-query-left-join-filter text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-sql-query-left-join-filter{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-sql-query-left-join-filter{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-sql-query-left-join-filter{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-sql-query-left-join-filter-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="695" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">LEFT JOIN：在哪一步筛</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">同一份用户与订单：</text><text x="18" y="90" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿呆：paid + refunded</text><text x="18" y="115" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿瓜：只有 refunded</text><text x="18" y="140" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿花：没有订单</text><rect x="18" y="175" width="252" height="174" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="205" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">① paid 条件放在 ON</text><text x="30" y="234" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">先配 paid，再补未配对行</text><text x="30" y="271" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿呆 → 10号 paid</text><text x="30" y="300" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿瓜 → NULL</text><text x="30" y="329" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿花 → NULL</text><rect x="18" y="372" width="252" height="187" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="402" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">② paid 条件放在 WHERE</text><text x="30" y="431" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">先按用户配，再逐行筛选</text><text x="30" y="468" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">阿呆 → 10号 paid：保留</text><text x="30" y="497" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">refunded 行：删除</text><text x="30" y="526" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">补出的 NULL 行：删除</text><text x="18" y="598" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">这里只比较 status = paid。</text><text x="18" y="623" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">WHERE 只保留条件为真的行；</text><text x="18" y="648" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">NULL = paid 不是 TRUE。</text></svg>