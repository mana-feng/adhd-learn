<svg xmlns="http://www.w3.org/2000/svg" id="v01-kaggle-methods-oof-boundary" viewBox="0 0 288 780" width="288" height="780" role="img" aria-labelledby="v01-kaggle-methods-oof-boundary-title v01-kaggle-methods-oof-boundary-desc"><title id="v01-kaggle-methods-oof-boundary-title">OOF：这行预测没有见过这行</title><desc id="v01-kaggle-methods-oof-boundary-desc">三折教学例中，训练B与C的模型只给A写预测，训练A与C只给B写预测，训练A与B只给C写预测。按原样本行号还原OOF表，多种基模型分别形成特征列，再与标签训练元模型。没有预测数值和实测分数。</desc><style>#v01-kaggle-methods-oof-boundary{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-kaggle-methods-oof-boundary text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-kaggle-methods-oof-boundary{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-kaggle-methods-oof-boundary{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-kaggle-methods-oof-boundary{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-kaggle-methods-oof-boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="780" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">OOF：这行预测没有见过这行</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">教学划分 A、B、C；无实测分数。</text><text x="18" y="90" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">每行训练一个基模型副本。</text><text x="18" y="113" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">训练：B + C</text><rect x="18" y="129" width="77" height="40" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="56.5" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">A</text><rect x="103" y="129" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="141.5" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text><rect x="188" y="129" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="226.5" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">C</text><text x="18" y="201" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">只给未参与训练的 A 写预测</text><text x="18" y="235" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">训练：A + C</text><rect x="18" y="251" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="56.5" y="278" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">A</text><rect x="103" y="251" width="77" height="40" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="141.5" y="278" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text><rect x="188" y="251" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="226.5" y="278" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">C</text><text x="18" y="323" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">只给未参与训练的 B 写预测</text><text x="18" y="357" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">训练：A + B</text><rect x="18" y="373" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="56.5" y="400" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">A</text><rect x="103" y="373" width="77" height="40" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="141.5" y="400" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text><rect x="188" y="373" width="77" height="40" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="226.5" y="400" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">C</text><text x="18" y="445" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">只给未参与训练的 C 写预测</text><path d="M144 465 L144 494" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#v01-kaggle-methods-oof-boundary-arrow)"/><rect x="18" y="505" width="252" height="117" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="535" font-size="17" font-weight="700" text-anchor="start" fill="var(--ink)">按原样本行号放回 OOF 表</text><text x="30" y="568" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">多种基模型 → 多列预测</text><text x="30" y="599" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">OOF 特征 + 标签 → 元模型</text><text x="18" y="658" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">预处理也只能在训练折拟合。</text><text x="18" y="683" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">分组/时序数据需匹配的划分。</text><text x="18" y="708" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">评估元模型另留外层验证；</text><text x="18" y="733" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">OOF 不是调参免过拟合证明。</text></svg>