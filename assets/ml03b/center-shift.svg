<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 258" role="img" aria-labelledby="title description">
<title id="title">最右端的订单变慢，两个中心怎样移动</title>
<desc id="description">五单为 14、15、16、17、60。把 60 改成 80 后，中位数仍是 16，均值从 24.4 变成 28.4。两条数轴用相同的分钟尺度。</desc>
<rect width="480" height="258" rx="8" fill="#f8f6ef"/>
<g font-family="system-ui, sans-serif" fill="#222821">
<text x="22" y="34" font-size="22" font-weight="700">只改变最右端那份订单</text>
<path d="M40 93H450m-6-4 6 4-6 4" stroke="#576250" stroke-width="1.6" fill="none"/>
<circle cx="62.6" cy="93" r="2.2" fill="#263127"/>
<circle cx="68.25" cy="93" r="2.2" fill="#263127"/>
<circle cx="73.9" cy="93" r="2.2" fill="#263127"/>
<circle cx="79.55000000000001" cy="93" r="2.2" fill="#263127"/>
<circle cx="322.5" cy="93" r="4" fill="#263127"/>
<path d="M73.9 92v-22h9" fill="none" stroke="#19566a" stroke-width="1.6"/>
<text x="86.9" y="75" fill="#194d60" font-size="18">中位数 16</text>
<path d="M121.36 86l5 7-5 7-5-7Z" fill="#93462f"/>
<text x="130.36" y="119" fill="#7c3c29" font-size="18">均值 24.4</text>
<text x="322.5" y="80" text-anchor="middle" font-size="18">60</text>
<text x="22" y="55" font-size="17" font-weight="650">原数据</text>
<path d="M22 134H458" stroke="#b9b8a8"/>
<path d="M40 197H450m-6-4 6 4-6 4" stroke="#576250" stroke-width="1.6" fill="none"/>
<circle cx="62.6" cy="197" r="2.2" fill="#263127"/>
<circle cx="68.25" cy="197" r="2.2" fill="#263127"/>
<circle cx="73.9" cy="197" r="2.2" fill="#263127"/>
<circle cx="79.55000000000001" cy="197" r="2.2" fill="#263127"/>
<circle cx="435.5" cy="197" r="4" fill="#263127"/>
<path d="M73.9 196v-22h9" fill="none" stroke="#19566a" stroke-width="1.6"/>
<text x="86.9" y="179" fill="#194d60" font-size="18">中位数 16</text>
<path d="M143.95999999999998 190l5 7-5 7-5-7Z" fill="#93462f"/>
<text x="152.95999999999998" y="223" fill="#7c3c29" font-size="18">均值 28.4</text>
<text x="435.5" y="184" text-anchor="middle" font-size="18">80</text>
<text x="22" y="159" font-size="17" font-weight="650">仅改最右值</text>
<text x="451" y="242" text-anchor="end" font-size="17">实际送达时间（分钟）</text>
</g>
</svg>
