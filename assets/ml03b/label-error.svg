<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 282" role="img" aria-labelledby="title description">
<title id="title">同一笔误录，两种罚分的变化</title>
<desc id="description">C 单预测 20 分钟不变，实际被从 25 误录为 50。平方误差由 25 变 900 分钟平方，是原来的 36 倍；绝对误差由 5 变 30 分钟，是原来的 6 倍。</desc>
<rect width="480" height="282" rx="8" fill="#f8f6ef"/>
<g font-family="system-ui, sans-serif" fill="#222821">
<text x="22" y="34" font-size="22" font-weight="700">C 单的实际时间被误录</text>
<text x="22" y="64" font-size="18">预测仍是 20 分钟　实际 25 → 50</text>
<path d="M22 82H458M22 174H458" stroke="#b9b8a8"/>
<text x="22" y="110" font-size="19" font-weight="650">平方误差（分钟²）</text>
<text x="22" y="139" font-size="18">原 25</text><rect x="118" y="123" width="7" height="15" fill="none" stroke="#7c3c29" stroke-width="2"/>
<text x="22" y="163" font-size="18">误录 900</text><rect x="118" y="147" width="252" height="15" fill="#93462f"/>
<text x="456" y="161" text-anchor="end" font-size="20" font-weight="750">36 倍</text>
<text x="22" y="203" font-size="19" font-weight="650">绝对误差（分钟）</text>
<text x="22" y="232" font-size="18">原 5</text><rect x="118" y="216" width="42" height="15" fill="none" stroke="#19566a" stroke-width="2"/>
<text x="22" y="256" font-size="18">误录 30</text><rect x="118" y="240" width="252" height="15" fill="#215b6b"/>
<text x="456" y="254" text-anchor="end" font-size="20" font-weight="750">6 倍</text>
</g>
</svg>
