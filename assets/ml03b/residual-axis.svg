<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img" aria-labelledby="title description">
<title id="title">两份订单，同样差两分钟</title>
<desc id="description">A 的预测18比实际20早，箭头向右。B 的预测32比实际30晚，箭头向左。</desc>
<rect width="480" height="244" rx="9" fill="#f8f6ef"/>
<g font-family="system-ui, sans-serif" fill="#222821">
<path d="M52 178H430m-6-5 6 5-6 5M76 172v12M106 172v12M256 172v12M286 172v12" fill="none" stroke="#526050" stroke-width="2"/>
<path d="M76 172V67M106 172V67M256 172V125M286 172V125" fill="none" stroke="#a3a497" stroke-dasharray="4 4" stroke-width="1.5"/>
<path d="M76 67h30m-8-6 8 6-8 6" fill="none" stroke="#9b432c" stroke-width="3"/>
<circle cx="76" cy="67" r="4" fill="#f8f6ef" stroke="#9b432c" stroke-width="2"/>
<path d="M286 125h-30m8-6-8 6 8 6" fill="none" stroke="#155369" stroke-width="3"/>
<circle cx="286" cy="125" r="4" fill="#f8f6ef" stroke="#155369" stroke-width="2"/>
<g font-size="20" font-weight="650">
<text x="52" y="40" fill="#873520">A　预测 18 → 实际 20　+2</text>
<text x="176" y="105" fill="#174d60">B　实际 30 ← 预测 32　−2</text>
</g>
<g font-size="17" text-anchor="middle">
<text x="76" y="207">18</text><text x="106" y="207">20</text>
<text x="256" y="207">30</text><text x="286" y="207">32</text>
</g>
<text x="379" y="227" font-size="17">分钟</text>
</g>
</svg>
