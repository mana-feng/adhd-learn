<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 261" role="img" aria-labelledby="title description">
<title id="title">残差 30 的订单占了多大份额</title>
<desc id="description">以各损失下全批预测梯度绝对值总和为百分之百。MSE 下异常单占 83.33%，MAE 下占 20%，Huber（δ=2 分钟）下占 25%。</desc>
<rect width="480" height="261" rx="8" fill="#f8f6ef"/>
<g font-family="system-ui, sans-serif" fill="#222821">
<defs>
<pattern id="order" width="7" height="7" patternUnits="userSpaceOnUse">
<rect width="7" height="7" fill="#93462f"/><path d="M0 7L7 0" stroke="#f1c7ac" stroke-width="1.3"/>
</pattern>
</defs>
<text x="23" y="34" font-size="22" font-weight="700">残差 30 的订单占了多少？</text>
<rect x="24" y="50" width="21" height="14" fill="url(#order)"/><text x="52" y="63" font-size="17">该订单</text>
<rect x="132" y="50" width="21" height="14" fill="#d4d6cb"/><text x="160" y="63" font-size="17">其余四单合计</text>
<path d="M118 85V212M370 85V212" stroke="#a3a598" stroke-dasharray="4 4"/>
<text x="24" y="111" font-size="19" font-weight="650">MSE</text>
<rect x="118" y="95" width="252" height="21" rx="2" fill="#d4d6cb"/>
<rect x="118" y="95" width="210" height="21" rx="2" fill="url(#order)"/>
<text x="456" y="112" text-anchor="end" font-size="20" font-weight="750">83.33%</text>
<text x="24" y="153" font-size="19" font-weight="650">MAE</text>
<rect x="118" y="137" width="252" height="21" rx="2" fill="#d4d6cb"/>
<rect x="118" y="137" width="50.4" height="21" rx="2" fill="url(#order)"/>
<text x="456" y="154" text-anchor="end" font-size="20" font-weight="750">20%</text>
<text x="24" y="195" font-size="19" font-weight="650">Huber</text>
<rect x="118" y="179" width="252" height="21" rx="2" fill="#d4d6cb"/>
<rect x="118" y="179" width="63" height="21" rx="2" fill="url(#order)"/>
<text x="456" y="196" text-anchor="end" font-size="20" font-weight="750">25%</text>
<text x="118" y="232" text-anchor="middle" font-size="16">0%</text>
<text x="370" y="232" text-anchor="middle" font-size="16">100%</text>
<text x="244" y="252" text-anchor="middle" font-size="16">全批预测梯度绝对值之和</text>
</g>
</svg>
