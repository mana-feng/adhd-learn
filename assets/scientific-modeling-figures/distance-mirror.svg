<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 954" role="img" aria-labelledby="sm-distance-mirror-title sm-distance-mirror-desc" class="sm-distance-mirror">
<title id="sm-distance-mirror-title">距离相同仍有镜像歧义</title>
<desc id="sm-distance-mirror-desc">四个固定标签的点A零零零、B一零零、C零二零、D零零三；镜像只令B的x变成负一。AB、AC、AD、BC、BD、CD分别为1、2、3、根号5、根号10、根号13，两构型完全相同。列向量B减A、C减A、D减A构成的行列式由正6变成负6。旋转和平移不能改变其符号，因此不能将固定标签的两构型重合。这是手工几何例子，不是分子实验。</desc>
<style>
.sm-distance-mirror text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
.sm-distance-mirror .title{font-size:24px;font-weight:700}
.sm-distance-mirror .strong{font-size:20px;font-weight:700}
.sm-distance-mirror .muted{fill:var(--muted,#60616c)}
.sm-distance-mirror .accent{fill:var(--accent,#b84d0a);font-weight:700}
.sm-distance-mirror .card{fill:var(--card,#fff);stroke:var(--border,#d6d2c9);stroke-width:1.5}
.sm-distance-mirror .highlight{fill:var(--accent-soft,#fff0e6);stroke:var(--accent,#b84d0a);stroke-width:1.6}
.sm-distance-mirror .edge{fill:none;stroke:var(--muted,#60616c);stroke-width:2}
.sm-distance-mirror .arrow{fill:none;stroke:var(--accent,#b84d0a);stroke-width:3;marker-end:url(#sm-distance-mirror-arrow)}
.sm-distance-mirror .node{fill:var(--card,#fff);stroke:var(--fg,#2a2a33);stroke-width:2}
</style>
<defs><marker id="sm-distance-mirror-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--accent,#b84d0a)" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="478" height="952" rx="16" fill="var(--bg,#faf9f6)" stroke="var(--border,#d6d2c9)"/>
<text x="24" y="39" class="title">距离一样，为什么还分左右？</text><text x="24" y="70" class="muted">四个固定标签的三维点；坐标单位任意</text><rect x="16" y="94" width="216" height="384" rx="12" class="card"/><rect x="248" y="94" width="216" height="384" rx="12" class="card"/><text x="32" y="126" class="strong">原构型 X</text><text x="264" y="126" class="strong">镜像 X′</text><path d="M132 252L194 252" class="edge"/><path d="M132 252L87 298" class="edge"/><path d="M132 252L132 158" class="edge"/><path d="M194 252L87 298" class="edge"/><path d="M194 252L132 158" class="edge"/><path d="M87 298L132 158" class="edge"/><circle cx="132" cy="252" r="5" class="node"/><text x="141" y="244" class="accent">A</text><circle cx="194" cy="252" r="5" class="node"/><text x="203" y="244" class="accent">B</text><circle cx="87" cy="298" r="5" class="node"/><text x="96" y="290" class="accent">C</text><circle cx="132" cy="158" r="5" class="node"/><text x="141" y="150" class="accent">D</text><text x="30" y="350">A (0, 0, 0)</text><text x="30" y="382">B (1, 0, 0)</text><text x="30" y="414">C (0, 2, 0)</text><text x="30" y="446">D (0, 0, 3)</text><path d="M364 252L302 252" class="edge"/><path d="M364 252L319 298" class="edge"/><path d="M364 252L364 158" class="edge"/><path d="M302 252L319 298" class="edge"/><path d="M302 252L364 158" class="edge"/><path d="M319 298L364 158" class="edge"/><circle cx="364" cy="252" r="5" class="node"/><text x="373" y="244" class="accent">A</text><circle cx="302" cy="252" r="5" class="node"/><text x="311" y="244" class="accent">B</text><circle cx="319" cy="298" r="5" class="node"/><text x="328" y="290" class="accent">C</text><circle cx="364" cy="158" r="5" class="node"/><text x="373" y="150" class="accent">D</text><text x="262" y="350">A (0, 0, 0)</text><text x="262" y="382">B (−1, 0, 0)</text><text x="262" y="414">C (0, 2, 0)</text><text x="262" y="446">D (0, 0, 3)</text><text x="24" y="510" class="muted">镜像操作：只把 x 坐标变号</text><rect x="16" y="532" width="448" height="134" rx="12" class="card"/><text x="32" y="562" class="strong">六条距离逐一相同</text><text x="32" y="598">AB = 1</text><text x="246" y="598">BC = √5</text><text x="32" y="630">AC = 2</text><text x="246" y="630">BD = √10</text><text x="32" y="658">AD = 3</text><text x="246" y="658">CD = √13</text><rect x="16" y="688" width="448" height="138" rx="12" class="highlight"/><text x="32" y="720" class="strong">有向行列式保留差别</text><text x="32" y="754">s = det[B−A, C−A, D−A]</text><text x="32" y="791">原构型：s = +6</text><text x="252" y="791">镜像：s = −6</text><text x="24" y="862" class="strong">固定 A、B、C、D 的对应关系：</text><text x="24" y="895">只做旋转和平移，无法让两者重合。</text><text x="24" y="930" class="muted">示意投影不按比例；距离由上方坐标计算。</text>
</svg>
