<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 870" role="img" aria-labelledby="sm-force-equivariance-title sm-force-equivariance-desc" class="sm-force-equivariance">
<title id="sm-force-equivariance-title">比较等变输出时要先变换原输出</title>
<desc id="sm-force-equivariance-desc">二维列向量示意，力f为一零，逆时针旋转90度后成为零一。对输入x撇等于R乘x加t，力输出F(X撇)应与R乘F(X)比较，而不是与未旋转的F(X)比较。纯平移t为二三时，孤立系统的力不加t，位置要加t。标量能量对整体旋转平移不变。假定无外场，例子是手算规则，不是模型验证。</desc>
<style>
.sm-force-equivariance text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
.sm-force-equivariance .title{font-size:24px;font-weight:700}
.sm-force-equivariance .strong{font-size:20px;font-weight:700}
.sm-force-equivariance .muted{fill:var(--muted,#60616c)}
.sm-force-equivariance .accent{fill:var(--accent,#b84d0a);font-weight:700}
.sm-force-equivariance .card{fill:var(--card,#fff);stroke:var(--border,#d6d2c9);stroke-width:1.5}
.sm-force-equivariance .highlight{fill:var(--accent-soft,#fff0e6);stroke:var(--accent,#b84d0a);stroke-width:1.6}
.sm-force-equivariance .edge{fill:none;stroke:var(--muted,#60616c);stroke-width:2}
.sm-force-equivariance .arrow{fill:none;stroke:var(--accent,#b84d0a);stroke-width:3}
.sm-force-equivariance .node{fill:var(--card,#fff);stroke:var(--fg,#2a2a33);stroke-width:2}
</style>
<defs><marker id="sm-force-equivariance-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--accent,#b84d0a)" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="478" height="868" rx="16" fill="var(--bg,#faf9f6)" stroke="var(--border,#d6d2c9)"/>
<text x="24" y="39" class="title">力变了，怎样才算预测对？</text><text x="24" y="71" class="muted">列向量约定；图示在二维平面内</text><rect x="16" y="94" width="448" height="230" rx="12" class="card"/><text x="32" y="126" class="strong">① 旋转：向量方向要一起转</text><text x="32" y="163">原来的力 f</text><text x="268" y="163">逆时针转 90°</text><path d="M64 241L162 241" class="arrow" marker-end="url(#sm-force-equivariance-arrow)"/><path d="M339 269L339 176" class="arrow" marker-end="url(#sm-force-equivariance-arrow)"/><text x="57" y="285">f = (1, 0)</text><text x="259" y="306">f′ = (0, 1)</text><rect x="16" y="346" width="448" height="153" rx="12" class="highlight"/><text x="32" y="379" class="strong">正确比较：先把原来的输出也旋转</text><text x="32" y="418">输入：x′ = R x + t</text><text x="32" y="454">力输出：F(X′) 应接近 R F(X)</text><text x="32" y="484" class="muted">不要要求旋转前后两个向量数值相同。</text><rect x="16" y="521" width="448" height="178" rx="12" class="card"/><text x="32" y="554" class="strong">② 平移：力向量不加平移量</text><text x="32" y="591">例：t = (2, 3)，输入位置一起挪动</text><text x="32" y="628">f′ = f = (1, 0)</text><text x="32" y="671" class="muted">位置要加 t；位移和力向量不加 t。</text><text x="24" y="738" class="strong">对照：孤立系统的标量能量</text><text x="24" y="775">同样变换后，E(X′) 应接近 E(X)。</text><text x="24" y="814" class="muted">条件：只改变整体位置与朝向；无外场。</text><text x="24" y="845" class="muted">这里只说明变换规则，没有运行模型。</text>
</svg>
