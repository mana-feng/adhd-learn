<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 882" role="img" aria-labelledby="sm-ucb-one-step-title sm-ucb-one-step-desc" class="sm-ucb-one-step">
<title id="sm-ucb-one-step-title">一轮UCB手算如何改变候选选择</title>
<desc id="sm-ucb-one-step-desc">最大化任务，候选仅A和B，手设预测均值与后验标准差：A为0.80与0.05，B为0.40与0.30。采集分数为均值加kappa乘后验标准差，kappa为0时A得0.80、B得0.40，选A；kappa为2时A得0.90、B得1.00，选B。B的真实值仍未知，需实验反馈。标准差不是方差，也不是观测噪声标准差。与章节8种子实验独立，不代表轨迹或普遍成功保证。</desc>
<style>
.sm-ucb-one-step text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
.sm-ucb-one-step .title{font-size:24px;font-weight:700}
.sm-ucb-one-step .strong{font-size:20px;font-weight:700}
.sm-ucb-one-step .muted{fill:var(--muted,#60616c)}
.sm-ucb-one-step .accent{fill:var(--accent,#b84d0a);font-weight:700}
.sm-ucb-one-step .card{fill:var(--card,#fff);stroke:var(--border,#d6d2c9);stroke-width:1.5}
.sm-ucb-one-step .highlight{fill:var(--accent-soft,#fff0e6);stroke:var(--accent,#b84d0a);stroke-width:1.6}
.sm-ucb-one-step .edge{fill:none;stroke:var(--muted,#60616c);stroke-width:2}
.sm-ucb-one-step .arrow{fill:none;stroke:var(--accent,#b84d0a);stroke-width:3;marker-end:url(#sm-ucb-one-step-arrow)}
.sm-ucb-one-step .node{fill:var(--card,#fff);stroke:var(--fg,#2a2a33);stroke-width:2}
</style>
<defs><marker id="sm-ucb-one-step-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--accent,#b84d0a)" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="478" height="880" rx="16" fill="var(--bg,#faf9f6)" stroke="var(--border,#d6d2c9)"/>
<text x="24" y="39" class="title">UCB 为什么会换一个候选？</text><text x="24" y="71" class="muted">一轮手算 · 最大化目标 · 候选只有 A、B</text><rect x="16" y="94" width="448" height="121" rx="12" class="card"/><text x="32" y="127" class="strong">采集分数 a = μ + κσ</text><text x="32" y="164">μ：预测均值　σ：后验标准差</text><text x="32" y="196" class="muted">κ ≥ 0：本轮探索权重</text><rect x="16" y="237" width="448" height="141" rx="12" class="card"/><text x="32" y="270" class="strong">同一轮的模型估计（手设）</text><text x="32" y="312">A：μ = 0.80，σ = 0.05</text><text x="32" y="350">B：μ = 0.40，σ = 0.30</text><rect x="16" y="400" width="448" height="128" rx="12" class="card"/><text x="32" y="435" class="strong">κ = 0：只按均值，选 A</text><text x="32" y="474">A：0.80 + 0 × 0.05 = 0.80</text><text x="32" y="509">B：0.40 + 0 × 0.30 = 0.40</text><rect x="16" y="550" width="448" height="128" rx="12" class="highlight"/><text x="32" y="585" class="strong">κ = 2：加入不确定性，选 B</text><text x="32" y="624">A：0.80 + 2 × 0.05 = 0.90</text><text x="32" y="659">B：0.40 + 2 × 0.30 = 1.00</text><text x="24" y="716" class="strong">选 B ≠ 已知 B 的真实目标值更高</text><text x="24" y="751">先做实验，再用新观测更新模型。</text><text x="24" y="794" class="muted">σ 不是 σ²，也不是观测噪声标准差。</text><text x="24" y="825" class="muted">本图不是后文 8 个种子的采样轨迹。</text><text x="24" y="856" class="muted">固定 κ = 2 不构成普遍成功保证。</text>
</svg>
