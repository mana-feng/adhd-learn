<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1030" role="img" aria-labelledby="ml12-shape-title ml12-shape-desc" class="ml12-shape">
  <title id="ml12-shape-title">图像经过网络后，尺寸怎么变？</title>
  <desc id="ml12-shape-desc">独立尺寸示例，按批次、通道、高、宽排列。输入N乘3乘32乘32。3到8通道的3格卷积，步幅1、填充1，得到N乘8乘32乘32；ReLU不改尺寸。2格步幅2最大池化得到N乘8乘16乘16。8到16通道的3格卷积，步幅1、填充1，得到N乘16乘16乘16。全局平均池化只平均空间高宽，得到N乘16乘1乘1；展平后N乘16；线性层得到N乘10个logits。卷积均采用dilation等于1、groups等于1，且有偏置。本图不代表当前章节训练代码的结构或实跑结果。</desc>
  <style>
    .ml12-shape text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
    .ml12-shape .ml12-title{font-size:22px;font-weight:700}
    .ml12-shape .ml12-dim{font-size:21px;font-weight:700}
    .ml12-shape .ml12-muted{fill:var(--muted,#6b6b76);font-size:16px}
    .ml12-shape .ml12-small{fill:var(--muted,#6b6b76);font-size:15px}
    .ml12-shape .ml12-card{fill:var(--card,#fff);stroke:var(--border,#d8d4cb);stroke-width:1.5}
    .ml12-shape .ml12-conv{fill:var(--accent-soft,#fff0e6);stroke:var(--accent,#b34b08);stroke-width:2}
    .ml12-shape .ml12-arrow{fill:none;stroke:var(--muted,#6b6b76);stroke-width:2;marker-end:url(#ml12-shape-arrow)}
  </style>
  <defs><marker id="ml12-shape-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--muted,#6b6b76)" stroke-width="1.6"/></marker></defs>
  <rect x="1" y="1" width="478" height="1028" rx="14" fill="var(--card,#fff)" stroke="var(--border,#d8d4cb)"/>
  <text x="240" y="36" text-anchor="middle" class="ml12-title">图像经过网络后，尺寸怎么变？</text>
  <text x="240" y="65" text-anchor="middle" class="ml12-muted">独立尺寸示例 · 不是本章训练结果</text>
  <text x="240" y="92" text-anchor="middle" class="ml12-small">顺序 NCHW：批次 N / 通道 C / 高 H / 宽 W</text>

  <rect x="24" y="113" width="432" height="65" rx="10" class="ml12-card"/>
  <text x="240" y="153" text-anchor="middle" class="ml12-dim">输入：N × 3 × 32 × 32</text>
  <path d="M240 179V207" class="ml12-arrow"/>

  <rect x="24" y="215" width="432" height="103" rx="10" class="ml12-conv"/>
  <text x="240" y="245" text-anchor="middle">Conv 3 → 8 · k=3 / s=1 / p=1</text>
  <text x="240" y="277" text-anchor="middle" class="ml12-dim">N × 8 × 32 × 32</text>
  <text x="240" y="304" text-anchor="middle" class="ml12-muted">空间不变，通道 3 → 8；ReLU 不改尺寸</text>
  <path d="M240 319V347" class="ml12-arrow"/>

  <rect x="24" y="355" width="432" height="103" rx="10" class="ml12-card"/>
  <text x="240" y="385" text-anchor="middle">MaxPool · k=2 / s=2 / p=0</text>
  <text x="240" y="417" text-anchor="middle" class="ml12-dim">N × 8 × 16 × 16</text>
  <text x="240" y="444" text-anchor="middle" class="ml12-muted">高、宽各减半；通道仍是 8</text>
  <path d="M240 459V487" class="ml12-arrow"/>

  <rect x="24" y="495" width="432" height="103" rx="10" class="ml12-conv"/>
  <text x="240" y="525" text-anchor="middle">Conv 8 → 16 · k=3 / s=1 / p=1</text>
  <text x="240" y="557" text-anchor="middle" class="ml12-dim">N × 16 × 16 × 16</text>
  <text x="240" y="584" text-anchor="middle" class="ml12-muted">空间不变，通道 8 → 16；ReLU 不改尺寸</text>
  <path d="M240 599V627" class="ml12-arrow"/>

  <rect x="24" y="635" width="432" height="103" rx="10" class="ml12-card"/>
  <text x="240" y="665" text-anchor="middle">GlobalAvgPool · 每通道取空间均值</text>
  <text x="240" y="697" text-anchor="middle" class="ml12-dim">N × 16 × 1 × 1</text>
  <text x="240" y="724" text-anchor="middle" class="ml12-muted">只平均 H / W，保留 N / C</text>
  <path d="M240 739V767" class="ml12-arrow"/>

  <rect x="24" y="775" width="432" height="75" rx="10" class="ml12-card"/>
  <text x="240" y="805" text-anchor="middle">Flatten(1) · 展平非批次维</text>
  <text x="240" y="835" text-anchor="middle" class="ml12-dim">N × 16</text>
  <path d="M240 851V879" class="ml12-arrow"/>

  <rect x="24" y="887" width="432" height="75" rx="10" class="ml12-card"/>
  <text x="240" y="917" text-anchor="middle">Linear(16, 10)</text>
  <text x="240" y="947" text-anchor="middle" class="ml12-dim">N × 10 个 logits</text>
  <text x="240" y="992" text-anchor="middle" class="ml12-small">卷积：dilation=1 / groups=1 / bias=True</text>
  <text x="240" y="1015" text-anchor="middle" class="ml12-small">池化：ceil_mode=False；N 始终不变</text>
</svg>
