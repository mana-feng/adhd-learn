<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 946" role="img" aria-labelledby="ml05-boundary-title ml05-boundary-desc" class="ml05-boundary">
  <title id="ml05-boundary-title">哪些数据可以参与 fit？</title>
  <desc id="ml05-boundary-desc">先划分训练、验证、测试。六个训练值为0、0、0、2、2、2；只有它们参与拟合，得到均值1和总体标准差1。验证值1、3复用训练统计量变成0、2，测试值2、4变成1、3。验证用于选配置，配置冻结后才打开测试集做最终评估。交叉验证的每一折都在训练折内拟合整个预处理与模型流水线；时间可用性和实体分组约束需要另选切分方案。本图画固定训练子集的手设示例；若冻结配置后合并训练与验证集重训，须重拟合整个预处理与模型流水线，测试集仍不参与。</desc>
  <style>
    .ml05-boundary text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
    .ml05-boundary .ml05-muted{fill:var(--muted,#6b6b76);font-size:16px}
    .ml05-boundary .ml05-small{fill:var(--muted,#6b6b76);font-size:15px}
    .ml05-boundary .ml05-title{font-size:22px;font-weight:700}
    .ml05-boundary .ml05-strong{font-weight:700}
    .ml05-boundary .ml05-card{fill:var(--card,#fff);stroke:var(--border,#d8d4cb);stroke-width:1.5}
    .ml05-boundary .ml05-fit{fill:var(--accent-soft,#fff0e6);stroke:var(--accent,#b34b08);stroke-width:2}
    .ml05-boundary .ml05-arrow{fill:none;stroke:var(--muted,#6b6b76);stroke-width:2;marker-end:url(#ml05-boundary-arrow)}
  </style>
  <defs>
    <marker id="ml05-boundary-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--muted,#6b6b76)" stroke-width="1.6"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="944" rx="14" fill="var(--card,#fff)" stroke="var(--border,#d8d4cb)"/>
  <text x="240" y="36" text-anchor="middle" class="ml05-title">哪些数据可以参与 fit？</text>
  <text x="240" y="65" text-anchor="middle" class="ml05-muted">先划分，再拟合；三份数据复用同一变换</text>

  <rect x="24" y="88" width="432" height="60" rx="10" class="ml05-card"/>
  <text x="240" y="124" text-anchor="middle" class="ml05-strong">① 先划分：训练 6 / 验证 2 / 测试 2</text>
  <path d="M240 149V174" class="ml05-arrow"/>
  <rect x="24" y="182" width="432" height="98" rx="10" class="ml05-card"/>
  <text x="240" y="213" text-anchor="middle" class="ml05-strong">训练值：[0, 0, 0, 2, 2, 2]</text>
  <text x="240" y="245" text-anchor="middle">只有这 6 个值可以参与 fit</text>
  <path d="M240 281V308" class="ml05-arrow"/>
  <rect x="24" y="316" width="432" height="91" rx="10" class="ml05-fit"/>
  <text x="240" y="348" text-anchor="middle" class="ml05-strong">② fit → 保存 μ = 1、σ = 1</text>
  <text x="240" y="379" text-anchor="middle" class="ml05-muted">总体标准差（ddof = 0）；z = (x − μ) / σ</text>

  <path d="M240 408V439H128V463" class="ml05-arrow"/>
  <path d="M240 439H352V463" class="ml05-arrow"/>
  <text x="240" y="431" text-anchor="middle" class="ml05-small">复用训练统计量</text>
  <rect x="24" y="471" width="208" height="151" rx="10" class="ml05-card"/>
  <text x="128" y="502" text-anchor="middle" class="ml05-strong">验证：只 transform</text>
  <text x="128" y="536" text-anchor="middle">[1, 3] → [0, 2]</text>
  <text x="128" y="575" text-anchor="middle">评估 / 选配置</text>
  <text x="128" y="603" text-anchor="middle" class="ml05-muted">不重新估计 μ / σ</text>
  <rect x="248" y="471" width="208" height="151" rx="10" class="ml05-card"/>
  <text x="352" y="502" text-anchor="middle" class="ml05-strong">测试：只 transform</text>
  <text x="352" y="536" text-anchor="middle">[2, 4] → [1, 3]</text>
  <text x="352" y="575" text-anchor="middle">冻结后最终评估</text>
  <text x="352" y="603" text-anchor="middle" class="ml05-muted">不重新估计 μ / σ</text>
  <text x="240" y="655" text-anchor="middle" class="ml05-strong">验证选好配置 → 冻结 → 打开测试集</text>

  <rect x="24" y="683" width="432" height="151" rx="10" class="ml05-card" stroke-dasharray="6 4"/>
  <text x="240" y="714" text-anchor="middle" class="ml05-strong">CV：每折都重新拟合整条 Pipeline</text>
  <rect x="40" y="731" width="400" height="84" rx="7" fill="var(--quote-bg,#f4f1ea)"/>
  <text x="56" y="762" class="ml05-muted">训练折：预处理 fit → 模型 fit</text>
  <text x="56" y="794" class="ml05-muted">验证折：同一预处理 transform → 评估</text>
  <text x="240" y="873" text-anchor="middle">时间 / 实体约束：另选切分方案</text>
  <text x="240" y="902" text-anchor="middle" class="ml05-small">6 / 2 / 2 是玩具数量，不是通用划分比例</text>
  <text x="240" y="925" text-anchor="middle" class="ml05-small">固定训练子集示例；合并重训须重拟合 Pipeline</text>
</svg>
