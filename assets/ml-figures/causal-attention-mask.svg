<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 970" role="img" aria-labelledby="ml14-mask-title ml14-mask-desc" class="ml14-mask">
  <title id="ml14-mask-title">第 2 个位置能看见哪些位置？</title>
  <desc id="ml14-mask-desc">四乘四因果注意力矩阵。行是查询位置i，列是键位置j。只有j小于等于i的格子可见，对角线保留；未来格用斜线和叉号标记。查询1只看键1；查询2看键1和2；查询3看键1到3；查询4看全部。第2行手设缩放分数0、ln3、2、负1，在softmax前把未来分数改为负无穷，得到权重0.25、0.75、0、0。V为4、8、100、负50时，第2个位置的输出为7，与后两个未来值无关。这是等长自注意力、无padding和dropout的示意，不是实测注意力。</desc>
  <style>
    .ml14-mask text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:var(--fg,#2a2a33);font-size:18px}
    .ml14-mask .ml14-title{font-size:22px;font-weight:700}
    .ml14-mask .ml14-muted{fill:var(--muted,#6b6b76);font-size:16px}
    .ml14-mask .ml14-small{fill:var(--muted,#6b6b76);font-size:15px}
    .ml14-mask .ml14-strong{font-weight:700}
    .ml14-mask .ml14-cell{fill:var(--card,#fff);stroke:var(--border,#d8d4cb);stroke-width:1.5}
    .ml14-mask .ml14-future{fill:url(#ml14-mask-hatch);stroke:var(--border,#d8d4cb);stroke-width:1.5}
    .ml14-mask .ml14-check text{font-size:23px;font-weight:700}
    .ml14-mask .ml14-card{fill:var(--card,#fff);stroke:var(--border,#d8d4cb);stroke-width:1.5}
    .ml14-mask .ml14-arrow{fill:none;stroke:var(--muted,#6b6b76);stroke-width:2;marker-end:url(#ml14-mask-arrow)}
  </style>
  <defs>
    <pattern id="ml14-mask-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--quote-bg,#f4f1ea)"/><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="var(--muted,#6b6b76)" stroke-opacity=".22" stroke-width="1"/></pattern>
    <marker id="ml14-mask-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--muted,#6b6b76)" stroke-width="1.6"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="968" rx="14" fill="var(--card,#fff)" stroke="var(--border,#d8d4cb)"/>
  <text x="240" y="36" text-anchor="middle" class="ml14-title">第 2 个位置能看见哪些位置？</text>
  <text x="240" y="66" text-anchor="middle" class="ml14-muted">因果约束：只看自己与过去，j ≤ i</text>
  <text x="260" y="104" text-anchor="middle">键位置 j →</text>
  <text x="164" y="136" text-anchor="middle">1</text><text x="228" y="136" text-anchor="middle">2</text><text x="292" y="136" text-anchor="middle">3</text><text x="356" y="136" text-anchor="middle">4</text>
  <text x="26" y="190">查询 1</text><text x="26" y="254" class="ml14-strong">查询 2</text><text x="26" y="318">查询 3</text><text x="26" y="382">查询 4</text>

  <rect x="132" y="152" width="64" height="64" class="ml14-cell"/><rect x="196" y="152" width="64" height="64" class="ml14-future"/><rect x="260" y="152" width="64" height="64" class="ml14-future"/><rect x="324" y="152" width="64" height="64" class="ml14-future"/>
  <rect x="132" y="216" width="64" height="64" class="ml14-cell"/><rect x="196" y="216" width="64" height="64" class="ml14-cell"/><rect x="260" y="216" width="64" height="64" class="ml14-future"/><rect x="324" y="216" width="64" height="64" class="ml14-future"/>
  <rect x="132" y="280" width="64" height="64" class="ml14-cell"/><rect x="196" y="280" width="64" height="64" class="ml14-cell"/><rect x="260" y="280" width="64" height="64" class="ml14-cell"/><rect x="324" y="280" width="64" height="64" class="ml14-future"/>
  <rect x="132" y="344" width="64" height="64" class="ml14-cell"/><rect x="196" y="344" width="64" height="64" class="ml14-cell"/><rect x="260" y="344" width="64" height="64" class="ml14-cell"/><rect x="324" y="344" width="64" height="64" class="ml14-cell"/>
  <rect x="130" y="214" width="260" height="68" rx="3" fill="none" stroke="var(--accent,#b34b08)" stroke-width="3"/>
  <g text-anchor="middle" class="ml14-check">
    <text x="164" y="192">✓</text><text x="228" y="192">×</text><text x="292" y="192">×</text><text x="356" y="192">×</text>
    <text x="164" y="256">✓</text><text x="228" y="256">✓</text><text x="292" y="256">×</text><text x="356" y="256">×</text>
    <text x="164" y="320">✓</text><text x="228" y="320">✓</text><text x="292" y="320">✓</text><text x="356" y="320">×</text>
    <text x="164" y="384">✓</text><text x="228" y="384">✓</text><text x="292" y="384">✓</text><text x="356" y="384">✓</text>
  </g>
  <text x="240" y="445" text-anchor="middle">✓ 可见（含自己） / × 与斜线：未来</text>
  <text x="240" y="479" text-anchor="middle" class="ml14-strong">读第 2 行：先遮分数，再算权重</text>
  <rect x="24" y="504" width="432" height="103" rx="10" class="ml14-card"/>
  <text x="240" y="536" text-anchor="middle">缩放分数：[0, ln(3), 2, −1]</text>
  <text x="240" y="571" text-anchor="middle" class="ml14-strong">加掩码后：[0, ln(3), −∞, −∞]</text>
  <text x="240" y="595" text-anchor="middle" class="ml14-small">−∞ 加在 softmax 之前，不是把分数填 0</text>
  <path d="M240 608V640" class="ml14-arrow"/>
  <rect x="24" y="648" width="432" height="87" rx="10" fill="var(--accent-soft,#fff0e6)" stroke="var(--accent,#b34b08)" stroke-width="2"/>
  <text x="240" y="678" text-anchor="middle">沿键轴 softmax</text>
  <text x="240" y="713" text-anchor="middle" class="ml14-strong">权重：[0.25, 0.75, 0, 0]</text>
  <path d="M240 736V768" class="ml14-arrow"/>
  <rect x="24" y="776" width="432" height="116" rx="10" class="ml14-card"/>
  <text x="240" y="808" text-anchor="middle">V = [4, 8, 100, −50]</text>
  <text x="240" y="843" text-anchor="middle" class="ml14-strong">输出 = 0.25×4 + 0.75×8 = 7</text>
  <text x="240" y="875" text-anchor="middle" class="ml14-muted">未来两项的权重为 0，不参与加权</text>
  <text x="240" y="925" text-anchor="middle" class="ml14-small">等长自注意力 · 无 padding / dropout</text>
  <text x="240" y="949" text-anchor="middle" class="ml14-small">分数、V 与权重均为手设示意，不是实测结果</text>
</svg>
