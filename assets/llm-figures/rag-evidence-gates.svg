:is([data-theme="light"] .llmov-figure,.llmov-figure[data-theme="light"]) { --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
:is([data-theme="dark"] .llmov-figure,.llmov-figure[data-theme="dark"]) { --llm-fig-bg:#172128; --llm-fig-card:#202e37; --llm-fig-ink:#edf3f6; --llm-fig-muted:#b8c7d0; --llm-fig-line:#8ca1ae; --llm-fig-accent:#80d2d8; --llm-fig-tint:#233d45; --llm-fig-warn:#ffd09a; --llm-fig-warm:#423323; }
