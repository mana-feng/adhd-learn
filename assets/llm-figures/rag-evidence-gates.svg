<defs><marker id="llmov-rag-evidence-gates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--llm-fig-accent)"/></marker></defs>
<rect width="320" height="898" rx="16" fill="var(--llm-fig-bg)"/>
<text class="title"><tspan x="18" y="32">召回到了，为什么仍会错？</tspan></text><text class="sub"><tspan x="18" y="60">三次检查 · 手工教学例，非实测</tspan></text><rect x="20" y="84" width="280" height="112" rx="12" class="box" /><text class="label"><tspan x="36" y="115">问题：这件商品能退吗？</tspan></text><text><tspan x="36" y="146">设定：要同时核对两个条件</tspan><tspan x="36" y="172">① 7 天内　② 未拆封</tspan></text><path class="arrow" d="M160 196 V224" marker-end="url(#llmov-rag-evidence-gates-arrow)"/><rect x="20" y="224" width="280" height="164" rx="12" class="tint" /><text class="label"><tspan x="36" y="255">1 / 候选集：找全了吗？</tspan></text><text><tspan x="36" y="286">[A] 期限：7 天内</tspan><tspan x="36" y="312">[B] 条件：未拆封</tspan><tspan x="36" y="338">[C] 无关资料</tspan></text><text class="sub"><tspan x="36" y="370">文档级 Recall@3 = 2/2 = 100%</tspan></text><path class="arrow" d="M160 388 V420" marker-end="url(#llmov-rag-evidence-gates-arrow)"/><rect x="20" y="420" width="280" height="126" rx="12" class="warm" /><text class="label"><tspan x="36" y="451">2 / 实际提示词：送全了吗？</tspan></text><text><tspan x="36" y="483">只放入 [A]，漏掉 [B]</tspan><tspan x="36" y="509">候选集 ≠ 模型实际读到的内容</tspan></text><path class="arrow" d="M160 546 V578" marker-end="url(#llmov-rag-evidence-gates-arrow)"/><rect x="20" y="578" width="280" height="166" rx="12" class="box" /><text class="label"><tspan x="36" y="609">3 / 答案与引用：撑得住吗？</tspan></text><text><tspan x="36" y="641">“7 天内均可退。[A]”</tspan></text><text><tspan x="36" y="675">✓ “7 天内”：A 有支持</tspan><tspan x="36" y="703">× “均可退”：省掉未拆封条件</tspan></text><rect x="20" y="770" width="280" height="100" rx="12" class="tint" /><text class="label"><tspan x="36" y="800">每一环留下原始证据</tspan></text><text class="sub"><tspan x="36" y="831">候选 → 实际上下文 → 引用原文</tspan><tspan x="36" y="857">权限、版本与拒答需另测。</tspan></text>
</svg>
