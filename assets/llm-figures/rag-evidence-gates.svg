<svg xmlns="http://www.w3.org/2000/svg" class="llmov-figure" width="320" height="898" viewBox="0 0 320 898" role="img" aria-labelledby="llmov-rag-evidence-gates-title llmov-rag-evidence-gates-desc">
<title id="llmov-rag-evidence-gates-title">召回到了，为什么答案仍会错？</title>
<desc id="llmov-rag-evidence-gates-desc">教学设定：一条退货问题必须同时满足期限7天和未拆封两个条件。候选A含期限、B含未拆封、C无关。相关文档A和B都在top3，文档级Recall@3等于2除以2即100%。实际提示词若只传A，则丢失B。回答7天内均可退并引用A，期限有支持，但均可退无支持，不能因为引用存在就判合格。这是手工构造示例，未执行检索或模型评分。</desc>
<style>
.llmov-figure { color-scheme:light dark; --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
