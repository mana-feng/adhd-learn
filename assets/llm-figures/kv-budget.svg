<svg xmlns="http://www.w3.org/2000/svg" class="llmov-figure" width="320" height="860" viewBox="0 0 320 860" role="img" aria-labelledby="llmov-kv-budget-title llmov-kv-budget-desc">
<title id="llmov-kv-budget-title">KV Cache为什么随长度和并发增长？</title>
<desc id="llmov-kv-budget-desc">标准全注意力、未压缩KV的理论张量字节数。假设32层、8个KV头、每头128维、每元素2字节。K和V各一份。batch为1、缓存1024 token时为134217728字节，即128 MiB；4096 token时512 MiB；四条相同长度4096 token的序列为2048 MiB，即2 GiB。条形长度按MiB成比例。仅计算KV，不含权重、激活、分配器与框架开销，不能当作整机实测。</desc>
<style>
.llmov-figure { color-scheme:light dark; --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
@media(prefers-color-scheme:dark) { .llmov-figure { --llm-fig-bg:#172128; --llm-fig-card:#202e37; --llm-fig-ink:#edf3f6; --llm-fig-muted:#b8c7d0; --llm-fig-line:#8ca1ae; --llm-fig-accent:#80d2d8; --llm-fig-tint:#233d45; --llm-fig-warn:#ffd09a; --llm-fig-warm:#423323; } }
:is([data-theme="light"] .llmov-figure,.llmov-figure[data-theme="light"]) { --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
:is([data-theme="dark"] .llmov-figure,.llmov-figure[data-theme="dark"]) { --llm-fig-bg:#172128; --llm-fig-card:#202e37; --llm-fig-ink:#edf3f6; --llm-fig-muted:#b8c7d0; --llm-fig-line:#8ca1ae; --llm-fig-accent:#80d2d8; --llm-fig-tint:#233d45; --llm-fig-warn:#ffd09a; --llm-fig-warm:#423323; }
.llmov-figure text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill:var(--llm-fig-ink); font-size:18px; }
.llmov-figure .title { font-size:21px; font-weight:700; }
.llmov-figure .sub { fill:var(--llm-fig-muted); font-size:16px; }
.llmov-figure .label { font-weight:700; }
.llmov-figure .accent { fill:var(--llm-fig-accent); }
.llmov-figure .warn { fill:var(--llm-fig-warn); }
.llmov-figure .formula { font-family: "Consolas", "Microsoft YaHei", monospace; font-size:18px; }
.llmov-figure .box { fill:var(--llm-fig-card); stroke:var(--llm-fig-line); stroke-width:1.2; }
.llmov-figure .tint { fill:var(--llm-fig-tint); stroke:var(--llm-fig-accent); stroke-width:1.5; }
.llmov-figure .warm { fill:var(--llm-fig-warm); stroke:var(--llm-fig-warn); stroke-width:1.5; }
.llmov-figure .arrow { fill:none; stroke:var(--llm-fig-accent); stroke-width:2; }
</style>
<defs><marker id="llmov-kv-budget-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--llm-fig-accent)"/></marker></defs>
<rect width="320" height="860" rx="16" fill="var(--llm-fig-bg)"/>
<text class="title"><tspan x="18" y="32">缓存为什么会越占越多？</tspan></text><text class="sub"><tspan x="18" y="60">全注意力 · 未压缩 KV · 理论值</tspan></text><rect x="20" y="84" width="280" height="158" rx="12" class="box" /><text class="label"><tspan x="36" y="115">先把结构和精度写出来</tspan></text><text><tspan x="36" y="145">32 层 · 8 个 KV 头</tspan><tspan x="36" y="171">每头 128 维 · 每元素 2 字节</tspan><tspan x="36" y="197">K 与 V 各存一份（×2）</tspan></text><rect x="20" y="264" width="280" height="116" rx="12" class="tint" /><text class="label"><tspan x="36" y="295">缓存字节 =</tspan></text><text class="formula"><tspan x="36" y="326">2 × 32 × 8 × 128</tspan><tspan x="36" y="352">× token 数 × batch × 2</tspan></text><text class="label"><tspan x="20" y="414">① 1 条序列 · 1024 token</tspan></text><text class="accent"><tspan x="20" y="443">128 MiB</tspan></text><rect x="20" y="456" width="16" height="18" rx="4" fill="var(--llm-fig-accent)"/><text class="label"><tspan x="20" y="510">② 长度 ×4 → 4096 token</tspan></text><text class="accent"><tspan x="20" y="539">512 MiB（batch = 1）</tspan></text><rect x="20" y="552" width="64" height="18" rx="4" fill="var(--llm-fig-accent)"/><text class="label"><tspan x="20" y="606">③ 再并发 4 条同长度序列</tspan></text><text class="accent"><tspan x="20" y="635">2048 MiB = 2 GiB</tspan></text><rect x="20" y="648" width="256" height="18" rx="4" fill="var(--llm-fig-accent)"/><text class="sub"><tspan x="20" y="698">条长按 MiB 比例；batch 表示序列数。</tspan></text><rect x="20" y="718" width="280" height="112" rx="12" class="warm" /><text class="sub"><tspan x="36" y="747">只算 KV，还没有算权重。</tspan><tspan x="36" y="773">激活、框架、分配开销需另留预算。</tspan></text><text class="sub"><tspan x="36" y="803">1 MiB = 2²⁰ B；1 GiB = 2³⁰ B</tspan></text>
</svg>
