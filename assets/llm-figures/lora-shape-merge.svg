<svg xmlns="http://www.w3.org/2000/svg" class="llmov-figure" width="320" height="810" viewBox="0 0 320 810" role="img" aria-labelledby="llmov-lora-shape-merge-title llmov-lora-shape-merge-desc">
<title id="llmov-lora-shape-merge-title">LoRA怎样变成原权重的改变量？</title>
<desc id="llmov-lora-shape-merge-desc">列向量约定。输入x为4乘1。冻结权重W为3乘4。可训练A为1乘4，B为3乘1，rank为1。两个支路均输出3乘1，相加得到y。原权重有12个参数，LoRA有4加3等于7个参数。这只是小型教学例。普通LoRA在推理状态下可把缩放后的BA加进W，形成同形状的W合并；量化合并和数值误差需另测。</desc>
<style>
.llmov-figure { color-scheme:light dark; --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
@media(prefers-color-scheme:dark) { .llmov-figure { --llm-fig-bg:#172128; --llm-fig-card:#202e37; --llm-fig-ink:#edf3f6; --llm-fig-muted:#b8c7d0; --llm-fig-line:#8ca1ae; --llm-fig-accent:#80d2d8; --llm-fig-tint:#233d45; --llm-fig-warn:#ffd09a; --llm-fig-warm:#423323; } }
:is([data-theme="light"] .llmov-figure,.llmov-figure[data-theme="light"]) { --llm-fig-bg:#fbfaf7; --llm-fig-card:#ffffff; --llm-fig-ink:#202d36; --llm-fig-muted:#526371; --llm-fig-line:#8596a2; --llm-fig-accent:#176b77; --llm-fig-tint:#e8f3f3; --llm-fig-warn:#98521a; --llm-fig-warm:#fff0df; }
:is([data-theme="dark"] .llmov-figure,.llmov-figure[data-theme="dark"]) { --llm-fig-bg:#172128; --llm-fig-card:#202e37; --llm-fig-ink:#edf3f6; --llm-fig-muted:#b8c7d0; --llm-fig-line:#8ca1ae; --llm-fig-accent:#80d2d8; --llm-fig-tint:#233d45; --llm-fig-warn:#ffd09a; --llm-fig-warm:#423323; }
.llmov-figure text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill:var(--llm-fig-ink); font-size:18px; }
.llmov-figure .title { font-size:21px; font-weight:700; }
.llmov-figure .sub { fill:var(--llm-fig-muted); font-size:16px; }
.llmov-figure .label { font-weight:700; }
.llmov-figure .accent { fill:var(--llm-fig-accent); }
.llmov-figure .warn { fill:var(--llm-fig-warn); }
.llmov-figure .formula { font-family: "Consolas", "Microsoft YaHei", monospace; font-size:18px; }
.llmov-figure .box { fill:var(--llm-fig-card); stroke:var(--llm-fig-line); stroke-width:1.2; }
.llmov-figure .tint { fill:var(--llm-fig-tint); stroke:var(--llm-fig-accent); stroke-width:1.5; }
.llmov-figure .warm { fill:var(--llm-fig-warm); stroke:var(--llm-fig-warn); stroke-width:1.5; }
.llmov-figure .arrow { fill:none; stroke:var(--llm-fig-accent); stroke-width:2; }
</style>
<defs><marker id="llmov-lora-shape-merge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--llm-fig-accent)"/></marker></defs>
<rect width="320" height="810" rx="16" fill="var(--llm-fig-bg)"/>
<text class="title"><tspan x="18" y="32">小矩阵怎样接回原权重？</tspan></text><text class="sub"><tspan x="18" y="60">普通 LoRA · 单层教学例 · r = 1</tspan></text><rect x="20" y="82" width="280" height="46" rx="12" class="tint" /><text class="label" text-anchor="middle"><tspan x="160" y="112">输入 x：4 × 1</tspan></text><path class="arrow" d="M160 128 V148 H84 V164" marker-end="url(#llmov-lora-shape-merge-arrow)"/><path class="arrow" d="M160 148 H238 V164" marker-end="url(#llmov-lora-shape-merge-arrow)"/><rect x="24" y="164" width="120" height="144" rx="12" class="box" stroke-dasharray="6 4"/><text class="label" text-anchor="middle"><tspan x="84" y="197">W：3 × 4</tspan><tspan x="84" y="223">冻结不更新</tspan></text><text class="sub" text-anchor="middle"><tspan x="84" y="281">Wx：3 × 1</tspan></text><rect x="176" y="164" width="120" height="56" rx="12" class="tint" /><text text-anchor="middle"><tspan x="236" y="188">A：1 × 4</tspan><tspan x="236" y="211">Ax：1 × 1</tspan></text><path class="arrow" d="M236 220 V246" marker-end="url(#llmov-lora-shape-merge-arrow)"/><rect x="176" y="246" width="120" height="62" rx="12" class="tint" /><text text-anchor="middle"><tspan x="236" y="272">B：3 × 1</tspan><tspan x="236" y="295">BAx：3 × 1</tspan></text><path class="arrow" d="M84 308 V340 H142" marker-end="url(#llmov-lora-shape-merge-arrow)"/><path class="arrow" d="M236 308 V340 H178" marker-end="url(#llmov-lora-shape-merge-arrow)"/><circle cx="160" cy="340" r="18" class="tint"/><text class="label" text-anchor="middle"><tspan x="160" y="347">+</tspan></text><text class="formula" text-anchor="middle"><tspan x="160" y="389">y = Wx + sBAx</tspan></text><text class="sub" text-anchor="middle"><tspan x="160" y="417">s = α/r；本例取 α = r = 1</tspan></text><rect x="20" y="446" width="280" height="110" rx="12" class="box" /><text class="label"><tspan x="36" y="475">① 少训练的是参数</tspan></text><text><tspan x="36" y="505">W：3 × 4 = 12 个</tspan><tspan x="36" y="531">A、B：1 × 4 + 3 × 1 = 7 个</tspan></text><rect x="20" y="578" width="280" height="150" rx="12" class="tint" /><text class="label"><tspan x="36" y="609">② 合并后仍是同样的形状</tspan></text><text class="formula"><tspan x="36" y="641">W合并 = W + sBA</tspan><tspan x="36" y="667">(3 × 4) + (3 × 1)(1 × 4)</tspan></text><text><tspan x="36" y="704">推理时：y = W合并 x</tspan></text><text class="sub"><tspan x="20" y="760">只展示单层，不代表整模型省显存比例。</tspan><tspan x="20" y="786">合并按推理态；量化与舍入误差另测。</tspan></text>
</svg>
