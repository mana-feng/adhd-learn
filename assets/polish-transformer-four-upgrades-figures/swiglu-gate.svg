<svg xmlns="http://www.w3.org/2000/svg" id="v01-transformer-four-upgrades-swiglu-gate" viewBox="0 0 288 780" width="288" height="780" role="img" aria-labelledby="v01-transformer-four-upgrades-swiglu-gate-title v01-transformer-four-upgrades-swiglu-gate-desc"><title id="v01-transformer-four-upgrades-swiglu-gate-title">SwiGLU 的门不是百分比</title><desc id="v01-transformer-four-upgrades-swiglu-gate-desc">忽略偏置并只看下投影前的一个中间维度，内容u等于2，g等于SiLU(z)。z为负1时门约负0.269、乘积负0.538；z为0时均为0；z为2时门约1.762、乘积3.523。门可以为负或大于1，不是零到百分之百的概率。</desc><style>#v01-transformer-four-upgrades-swiglu-gate{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}#v01-transformer-four-upgrades-swiglu-gate text{font-family:"Microsoft YaHei",system-ui,sans-serif}@media(prefers-color-scheme:dark){#v01-transformer-four-upgrades-swiglu-gate{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}}[data-theme="dark"] #v01-transformer-four-upgrades-swiglu-gate{--paper:#172431;--ink:#f0f5fa;--line:#8fa6ba;--soft:#243b50;--accent:#90d2ff;--warm:#493b26}[data-theme="light"] #v01-transformer-four-upgrades-swiglu-gate{--paper:#fffdf8;--ink:#172c40;--line:#9cafbd;--soft:#edf3f8;--accent:#075f99;--warm:#fff0dd}</style><defs><marker id="v01-transformer-four-upgrades-swiglu-gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker></defs><rect width="288" height="780" rx="12" fill="var(--paper)"/><text x="18" y="32" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">SwiGLU 的门不是百分比</text><text x="18" y="65" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">只看一个中间维度，</text><text x="18" y="90" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">内容支路 u = 2；门输入为 z。</text><rect x="18" y="109" width="252" height="79" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="139" font-size="19" font-weight="700" text-anchor="start" fill="var(--ink)">门值 g = SiLU(z)</text><text x="30" y="169" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">SiLU(z) = z / (1 + exp(−z))</text><rect x="18" y="218" width="252" height="91" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="247" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">z = −1  →  g ≈ −0.269</text><text x="30" y="282" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">中间乘积 u × g ≈ −0.538</text><rect x="18" y="330" width="252" height="91" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="359" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">z = 0  →  g ≈ 0</text><text x="30" y="394" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">中间乘积 u × g ≈ 0</text><rect x="18" y="442" width="252" height="91" rx="9" fill="var(--warm)" stroke="var(--line)" stroke-width="1.5"/><text x="30" y="471" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">z = 2  →  g ≈ 1.762</text><text x="30" y="506" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">中间乘积 u × g ≈ 3.523</text><text x="18" y="574" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">门值可以为负，也可以大于 1。</text><text x="18" y="599" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">它不是概率，不是放行百分比。</text><text x="18" y="624" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">完整输出还要经过下投影。</text><rect x="18" y="662" width="252" height="78" rx="9" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="691" font-size="18" font-weight="700" text-anchor="start" fill="var(--ink)">SwiGLU(x) =</text><text x="30" y="720" font-size="17" font-weight="400" text-anchor="start" fill="var(--ink)">(SiLU(xWg) ⊙ xWu)Wd</text></svg>